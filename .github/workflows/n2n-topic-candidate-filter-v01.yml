name: N2N Topic Candidate Filter v0.1
on:
  push:
    paths:
      - 'scripts/n2n_topic_candidate_filter_v01.py'
      - 'references/community/reddit-uri-index.csv'
      - '.github/workflows/n2n-topic-candidate-filter-v01.yml'
  workflow_dispatch:
jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Filter lexical candidates into review pool
        run: python scripts/n2n_topic_candidate_filter_v01.py
      - uses: actions/upload-artifact@v4
        with:
          name: n2n-topic-review-candidates-v0.1
          path: |
            artifacts/n2n-topic-review-candidates-v0.1.csv
            artifacts/n2n-topic-review-candidates-v0.1.json
