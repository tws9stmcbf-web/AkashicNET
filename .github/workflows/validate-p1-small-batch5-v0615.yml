name: Validate P1 small batch5 hash evidence v0.6.15

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_p1_small_batch5_v0615.py
      - run: python scripts/test_validate_p1_small_batch5_v0615.py
