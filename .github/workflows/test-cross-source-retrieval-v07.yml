name: Test cross-source retrieval v0.7

on:
  push:
    branches:
      - akashicnet-validation-descendants
    paths:
      - 'scripts/build_knowledge_graph_v02.py'
      - 'scripts/build_knowledge_graph_v03.py'
      - 'scripts/overlay_canonical_reconciliation_v04.py'
      - 'scripts/overlay_evidence_provenance_v05.py'
      - 'scripts/build_cross_source_graph_v07.py'
      - 'scripts/query_cross_source_graph_v07.py'
      - 'references/community/n2n-pilot-index.csv'
      - '.github/workflows/test-cross-source-retrieval-v07.yml'

jobs:
  cross-source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build graph v0.2-v0.5
        run: |
          python scripts/build_knowledge_graph_v02.py
          python scripts/build_knowledge_graph_v03.py
          python scripts/overlay_canonical_reconciliation_v04.py
          python scripts/overlay_evidence_provenance_v05.py
      - name: Overlay curated N2N pilot v0.7
        run: python scripts/build_cross_source_graph_v07.py
      - name: Run federated retrieval samples
        run: |
          mkdir -p data/retrieval-v0.7-samples
          python scripts/query_cross_source_graph_v07.py 'Akashic Library' > data/retrieval-v0.7-samples/akashic-library.json
          python scripts/query_cross_source_graph_v07.py 'consciousness' > data/retrieval-v0.7-samples/consciousness.json
          python scripts/query_cross_source_graph_v07.py 'Abramelin' > data/retrieval-v0.7-samples/abramelin.json
      - name: Assert cross-source integrity
        run: |
          python - <<'PY'
          import json
          g=json.load(open('data/knowledge-graph-v0.7.json',encoding='utf-8'))
          c=g['cross_source']
          assert g['integrity']['release_integrity_pass'] is True
          assert c['integrity_pass'] is True
          assert c['reddit_records']==1000
          assert c['reddit_canonical_source']=='Reddit'
          assert c['archive_mode']=='metadata_and_links_only'
          assert c['scientific_evidence_default'] is False
          reddit=[n for n in g['nodes'] if n.get('node_type')=='reddit_post']
          assert len(reddit)==1000
          assert len({n['canonical_url'] for n in reddit})==1000
          assert all(n['rights_status']=='LINK_ONLY_METADATA' for n in reddit)
          assert all(n['not_scientific_evidence_by_default'] is True for n in reddit)
          q=json.load(open('data/retrieval-v0.7-samples/akashic-library.json',encoding='utf-8'))
          assert q['source_boundaries_explicit'] is True
          assert q['truth_inference_allowed'] is False
          assert any(r['node_type']=='reddit_post' for r in q['results'])
          a=json.load(open('data/retrieval-v0.7-samples/abramelin.json',encoding='utf-8'))
          assert any(r.get('family_id')=='CANON-0006' for r in a['results'])
          print(f"AKASHICNET cross-source v0.7 PASS: {c['reddit_records']} Reddit records; {c['explicit_canonical_cross_links']} conservative cross-links")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cross-source-retrieval-v0.7
          path: |
            data/knowledge-graph-v0.7.json
            data/retrieval-v0.7-samples/*.json
          if-no-files-found: error
