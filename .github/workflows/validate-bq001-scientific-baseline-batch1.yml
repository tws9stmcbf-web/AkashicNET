name: Validate BQ001 scientific baseline batch 1

on:
  pull_request:
    paths:
      - 'references/community/bq001-scientific-baseline-batch1.json'
      - 'references/community/evidence-taxonomy-v0.10.json'
      - 'data/evidence_claim_v01.schema.json'
      - 'scripts/validate_bq001_scientific_baseline_batch1.py'
      - 'tests/test_bq001_scientific_baseline_batch1.py'
      - '.github/workflows/validate-bq001-scientific-baseline-batch1.yml'
  push:
    branches: [main]
    paths:
      - 'references/community/bq001-scientific-baseline-batch1.json'
      - 'references/community/evidence-taxonomy-v0.10.json'
      - 'data/evidence_claim_v01.schema.json'
      - 'scripts/validate_bq001_scientific_baseline_batch1.py'
      - 'tests/test_bq001_scientific_baseline_batch1.py'
      - '.github/workflows/validate-bq001-scientific-baseline-batch1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python scripts/validate_bq001_scientific_baseline_batch1.py
      - run: python -m pytest -q tests/test_bq001_scientific_baseline_batch1.py
