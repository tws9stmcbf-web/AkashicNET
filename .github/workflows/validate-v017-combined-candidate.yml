name: Validate v0.17 combined candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and record exact tested commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 645cffad768e2591638c46934bc96555ad6abc40 HEAD
          git merge-base --is-ancestor 4867ca7c8c9a4e1bc139f630815ecf49c79a2ef7 HEAD
          echo "Tested commit: $EXPECTED_HEAD" >> "$GITHUB_STEP_SUMMARY"
          echo "Validation evidence only; release decision remains pending review and human approval." >> "$GITHUB_STEP_SUMMARY"
      - name: Install validation dependencies
        run: python -m pip install jsonschema==4.25.1 pytest
      - name: Validate inherited candidate and sealed public status
        env:
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          from scripts.validate_v016_release_candidate import MANIFEST, validate_manifest, run_dependencies
          errors = validate_manifest(json.loads(MANIFEST.read_text(encoding="utf-8")))
          if errors:
              raise SystemExit("Inherited manifest validation failed: " + ", ".join(errors))
          run_dependencies()
          PY
          python scripts/validate_public_status_consistency_v015.py
      - name: Validate typed public status and mutation cases
        run: |
          python scripts/validate_public_status_consistency_v016.py
          python -m unittest discover -s tests -p 'test_public_status_consistency_v016.py'
      - name: Validate inventory and comparison with Git provenance
        run: |
          python scripts/validate_bq001_framework_inventory_v017.py
          python scripts/validate_bq001_framework_comparison_v017.py
          python -m unittest tests.test_bq001_framework_inventory_v017 tests.test_bq001_framework_comparison_v017
      - name: Preserve current v0.2.0 bytes and validate structure
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from scripts.prepare_semantic_link_candidates_v020 import validate_packet
          raw = Path('references/community/semantic-link-candidates-v0.2.0.json').read_bytes()
          if hashlib.sha256(raw).hexdigest() != '41b178b5aeca1fc66e8036a0403d4b520225bbe3d61fa2e199f522d089358c6f':
              raise SystemExit('v0.2.0 packet changed; historical review required')
          packet = json.loads(raw)
          errors = validate_packet(packet, '0.2.0')
          if errors:
              raise SystemExit('v0.2.0 historical packet invalid: ' + ', '.join(errors))
          PY
      - name: Rebuild and validate current review packet
        run: python scripts/prepare_semantic_link_candidates_v020.py --version 0.2.1 --check
      - name: Run fail-closed tests
        run: python -m unittest -v tests/test_prepare_semantic_link_candidates_v020.py
      - name: Compile generator and tests
        run: python -m py_compile scripts/prepare_semantic_link_candidates_v020.py tests/test_prepare_semantic_link_candidates_v020.py
      - name: Confirm candidate merge gate
        run: |
          grep -F "automation/semantic-link-candidates-" .github/workflows/merge-audited-cross-source-review.yml
          grep -F "validate-semantic-link-candidates" .github/workflows/merge-audited-cross-source-review.yml
          grep -F "semantic-link-candidates-v0.2.0.json" .github/workflows/merge-audited-cross-source-review.yml

      - name: Confirm validators leave tracked artifacts unchanged
        run: git diff --exit-code
