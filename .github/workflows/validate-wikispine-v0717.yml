name: Validate WikiSpine v0.7.17

on:
  pull_request:
    paths:
      - 'references/community/wikispine-batch-r-works-v0.7.17.json'
      - 'references/community/wikispine-entity-aggregate-v0.7.17.json'
      - 'references/community/wikispine-entity-aggregate-v0.7.16.json'
      - 'scripts/validate_wikispine_v0717.py'
      - '.github/workflows/validate-wikispine-v0717.yml'
  push:
    branches: [main]
    paths:
      - 'references/community/wikispine-batch-r-works-v0.7.17.json'
      - 'references/community/wikispine-entity-aggregate-v0.7.17.json'
      - 'references/community/wikispine-entity-aggregate-v0.7.16.json'
      - 'scripts/validate_wikispine_v0717.py'
      - '.github/workflows/validate-wikispine-v0717.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate WikiSpine v0.7.17
        run: python scripts/validate_wikispine_v0717.py
