name: Public data boundary

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check public/private corpus boundary
        run: python scripts/check_public_data_boundary.py
      - name: Run public-data boundary regression tests
        run: |
          python -m pip install pytest
          pytest -q tests/test_public_data_boundary.py
