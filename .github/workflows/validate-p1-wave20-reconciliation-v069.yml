name: Validate P1 wave20 reconciliation v0.6.9

on:
  pull_request:
    paths:
      - 'references/community/drive-p1-wave20-reconciliation-v0.6.9.json'
      - 'scripts/validate_p1_wave20_reconciliation_v069.py'
      - '.github/workflows/validate-p1-wave20-reconciliation-v069.yml'
  push:
    branches: [ main ]
    paths:
      - 'references/community/drive-p1-wave20-reconciliation-v0.6.9.json'
      - 'scripts/validate_p1_wave20_reconciliation_v069.py'
      - '.github/workflows/validate-p1-wave20-reconciliation-v069.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_p1_wave20_reconciliation_v069.py
