name: Validate PRE-ALPHA v0.10 release checkpoint

on:
  pull_request:
    paths:
      - 'references/community/v010-release-checkpoint.json'
      - 'references/community/v010-repository-release-audit.json'
      - 'scripts/validate_v010_release_checkpoint.py'
      - 'tests/test_v010_release_checkpoint.py'
      - '.github/workflows/validate-v010-release-checkpoint.yml'
  push:
    branches: [main]
    paths:
      - 'references/community/v010-release-checkpoint.json'
      - 'references/community/v010-repository-release-audit.json'
      - 'scripts/validate_v010_release_checkpoint.py'
      - 'tests/test_v010_release_checkpoint.py'
      - '.github/workflows/validate-v010-release-checkpoint.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_v010_release_checkpoint.py
      - run: python -m pip install pytest
      - run: pytest -q tests/test_v010_release_checkpoint.py
