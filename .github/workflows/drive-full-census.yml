name: Drive full recursive census

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/drive-full-census.yml'
      - 'scripts/drive_full_census.py'
      - 'references/community/drive-metadata-root-census.csv'
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run recursive paginated Drive census
        env:
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ secrets.GOOGLE_DRIVE_ACCESS_TOKEN }}
        run: |
          python scripts/drive_full_census.py
      - name: Upload census artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-live-full-census
          path: |
            references/community/drive-live-full-folder-census.csv
            references/community/drive-live-full-object-census.csv
            references/community/drive-live-full-census-summary.json
          if-no-files-found: warn
