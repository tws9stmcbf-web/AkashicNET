name: Validate private hash batch contract

on:
  pull_request:
    paths:
      - 'scripts/validate_private_hash_batch.py'
      - '.github/workflows/validate-private-hash-batch.yml'
  push:
    branches: [ main ]
    paths:
      - 'scripts/validate_private_hash_batch.py'
      - '.github/workflows/validate-private-hash-batch.yml'
  workflow_dispatch:

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run privacy-safe validator self-test
        run: python scripts/validate_private_hash_batch.py --self-test
