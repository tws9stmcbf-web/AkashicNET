name: Test knowledge graph retrieval v0.6

on:
  push:
    branches:
      - akashicnet-validation-descendants
    paths:
      - 'scripts/query_knowledge_graph_v06.py'
      - 'scripts/build_knowledge_graph_v02.py'
      - 'scripts/build_knowledge_graph_v03.py'
      - 'scripts/overlay_canonical_reconciliation_v04.py'
      - 'scripts/overlay_evidence_provenance_v05.py'
      - 'references/community/drive-metadata-root-census.csv'
      - 'references/community/drive-metadata-descendant-census.csv'
      - 'references/community/drive-validation-descendant-batch-0010.csv'
      - 'references/community/drive-validation-descendant-batch-0011.csv'
      - 'references/community/drive-canonical-resolution-stage-b-graph-overlay.csv'
      - 'references/community/drive-canonicalisation-reconciliation-v0.1.csv'
      - '.github/workflows/test-knowledge-graph-retrieval-v06.yml'

jobs:
  retrieval-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build graph v0.2-v0.5
        run: |
          python scripts/build_knowledge_graph_v02.py
          python scripts/build_knowledge_graph_v03.py
          python scripts/overlay_canonical_reconciliation_v04.py
          python scripts/overlay_evidence_provenance_v05.py
      - name: Run controlled retrieval examples
        run: |
          mkdir -p data/retrieval-v0.6
          python scripts/query_knowledge_graph_v06.py 'Abramelin' --node-type canonical_candidate_family > data/retrieval-v0.6/abramelin.json
          python scripts/query_knowledge_graph_v06.py 'Ramayana' --node-type canonical_candidate_family > data/retrieval-v0.6/ramayana.json
          python scripts/query_knowledge_graph_v06.py 'Vimalakirti Nirdesa Sutra' --node-type canonical_candidate_family > data/retrieval-v0.6/vimalakirti.json
          python scripts/query_knowledge_graph_v06.py 'Selected works by Niels Bohr' --node-type drive_object > data/retrieval-v0.6/niels-bohr.json
      - name: Assert provenance-aware retrieval integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('data/retrieval-v0.6')
          abr=json.load(open(d/'abramelin.json',encoding='utf-8'))
          ram=json.load(open(d/'ramayana.json',encoding='utf-8'))
          vim=json.load(open(d/'vimalakirti.json',encoding='utf-8'))
          bohr=json.load(open(d/'niels-bohr.json',encoding='utf-8'))
          for x in (abr,ram,vim,bohr):
              assert x['retrieval_scope']=='metadata_graph_only'
              assert x['truth_inference_allowed'] is False
              assert x['rights_promotion_allowed'] is False
              assert x['result_count']>=1
              assert x['results'][0]['provenance_path']
          assert abr['results'][0]['family_id']=='CANON-0006'
          assert abr['results'][0]['evidence_score'] is not None
          assert ram['results'][0]['family_id']=='CANON-0010'
          assert ram['results'][0]['review_state']=='unresolved'
          assert ram['results'][0]['evidence_score']<=45
          assert vim['results'][0]['family_id']=='CANON-0025'
          assert vim['results'][0]['review_state']=='provisional'
          assert vim['results'][0]['evidence_score']<=55
          assert bohr['results'][0]['node_type']=='drive_object'
          assert bohr['results'][0]['rights_status']=='UNKNOWN_UNVERIFIED'
          print('AKASHICNET retrieval v0.6 PASS: provenance paths, confidence, uncertainty caps and rights boundary verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-v0.6-samples
          path: data/retrieval-v0.6/*.json
          if-no-files-found: error
