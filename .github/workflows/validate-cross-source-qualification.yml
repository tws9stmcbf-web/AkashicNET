name: Validate cross-source qualification

on:
  pull_request:
    paths:
      - "references/community/cross-source-candidate-qualification-policy-v0.1.2.json"
      - "references/community/cross-source-qualification-batch-v0.1.3.json"
      - "references/community/cross-source-qualification-batch-v0.1.5.json"
      - "schemas/public-safe-endpoint-registry-v0.1.4.schema.json"
      - "references/community/public-safe-endpoint-registry-fixture-v0.1.4.json"
      - "scripts/validate_cross_source_candidate_qualification_v012.py"
      - "scripts/validate_cross_source_qualification_batch_v013.py"
      - "scripts/validate_cross_source_qualification_batch_v015.py"
      - "scripts/validate_public_safe_endpoint_registry_v014.py"
      - "tests/test_cross_source_candidate_qualification_v012.py"
      - "tests/test_cross_source_qualification_batch_v013.py"
      - "tests/test_cross_source_qualification_batch_v015.py"
      - "tests/test_public_safe_endpoint_registry_v014.py"
      - ".github/workflows/validate-cross-source-qualification.yml"
  push:
    branches: [main]
    paths:
      - "references/community/cross-source-candidate-qualification-policy-v0.1.2.json"
      - "references/community/cross-source-qualification-batch-v0.1.3.json"
      - "references/community/cross-source-qualification-batch-v0.1.5.json"
      - "schemas/public-safe-endpoint-registry-v0.1.4.schema.json"
      - "references/community/public-safe-endpoint-registry-fixture-v0.1.4.json"
      - "scripts/validate_cross_source_candidate_qualification_v012.py"
      - "scripts/validate_cross_source_qualification_batch_v013.py"
      - "scripts/validate_cross_source_qualification_batch_v015.py"
      - "scripts/validate_public_safe_endpoint_registry_v014.py"
      - "tests/test_cross_source_candidate_qualification_v012.py"
      - "tests/test_cross_source_qualification_batch_v013.py"
      - "tests/test_cross_source_qualification_batch_v015.py"
      - "tests/test_public_safe_endpoint_registry_v014.py"
      - ".github/workflows/validate-cross-source-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate qualification policy and governed reports
        run: |
          python scripts/validate_cross_source_candidate_qualification_v012.py
          python scripts/validate_cross_source_qualification_batch_v013.py
          python scripts/validate_cross_source_qualification_batch_v015.py
          python scripts/validate_public_safe_endpoint_registry_v014.py
      - name: Run fail-closed mutation tests
        run: |
          python -m unittest -v \
            tests/test_cross_source_candidate_qualification_v012.py \
            tests/test_cross_source_qualification_batch_v013.py \
            tests/test_cross_source_qualification_batch_v015.py \
            tests/test_public_safe_endpoint_registry_v014.py
      - name: Compile governed validators and tests
        run: |
          python -m py_compile \
            scripts/validate_cross_source_candidate_qualification_v012.py \
            scripts/validate_cross_source_qualification_batch_v013.py \
            scripts/validate_cross_source_qualification_batch_v015.py \
            scripts/validate_public_safe_endpoint_registry_v014.py \
            tests/test_cross_source_candidate_qualification_v012.py \
            tests/test_cross_source_qualification_batch_v013.py \
            tests/test_cross_source_qualification_batch_v015.py \
            tests/test_public_safe_endpoint_registry_v014.py
      - name: Parse governed JSON artifacts
        run: |
          python -m json.tool references/community/cross-source-candidate-qualification-policy-v0.1.2.json >/dev/null
          python -m json.tool references/community/cross-source-qualification-batch-v0.1.3.json >/dev/null
          python -m json.tool references/community/cross-source-qualification-batch-v0.1.5.json >/dev/null
          python -m json.tool schemas/public-safe-endpoint-registry-v0.1.4.schema.json >/dev/null
          python -m json.tool references/community/public-safe-endpoint-registry-fixture-v0.1.4.json >/dev/null
