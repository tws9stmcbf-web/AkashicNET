name: Validate cross-source qualification

on:
  pull_request:
    paths:
      - "references/community/cross-source-candidate-qualification-policy-v0.1.2.json"
      - "references/community/cross-source-qualification-batch-v0.1.3.json"
      - "scripts/validate_cross_source_candidate_qualification_v012.py"
      - "scripts/validate_cross_source_qualification_batch_v013.py"
      - "tests/test_cross_source_candidate_qualification_v012.py"
      - "tests/test_cross_source_qualification_batch_v013.py"
      - ".github/workflows/validate-cross-source-qualification.yml"
  push:
    branches: [main]
    paths:
      - "references/community/cross-source-candidate-qualification-policy-v0.1.2.json"
      - "references/community/cross-source-qualification-batch-v0.1.3.json"
      - "scripts/validate_cross_source_candidate_qualification_v012.py"
      - "scripts/validate_cross_source_qualification_batch_v013.py"
      - "tests/test_cross_source_candidate_qualification_v012.py"
      - "tests/test_cross_source_qualification_batch_v013.py"
      - ".github/workflows/validate-cross-source-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate qualification policy and Batch 2 report
        run: |
          python scripts/validate_cross_source_candidate_qualification_v012.py
          python scripts/validate_cross_source_qualification_batch_v013.py
      - name: Run fail-closed mutation tests
        run: |
          python -m unittest -v \
            tests/test_cross_source_candidate_qualification_v012.py \
            tests/test_cross_source_qualification_batch_v013.py
      - name: Compile governed validators and tests
        run: |
          python -m py_compile \
            scripts/validate_cross_source_candidate_qualification_v012.py \
            scripts/validate_cross_source_qualification_batch_v013.py \
            tests/test_cross_source_candidate_qualification_v012.py \
            tests/test_cross_source_qualification_batch_v013.py
      - name: Parse governed JSON artifacts
        run: |
          python -m json.tool references/community/cross-source-candidate-qualification-policy-v0.1.2.json >/dev/null
          python -m json.tool references/community/cross-source-qualification-batch-v0.1.3.json >/dev/null
