name: Validate v0.16 source status

on:
  pull_request:
    paths:
      - "schemas/source-status-v0.16.schema.json"
      - "references/source-status-fixture-v0.16*.json"
      - "scripts/validate_source_status_v016.py"
      - "tests/test_source_status_v016.py"
      - ".github/workflows/validate-source-status-v016.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate bounded fixture
        run: python scripts/validate_source_status_v016.py
      - name: Run mutation tests
        run: python -m pytest -q tests/test_source_status_v016.py
