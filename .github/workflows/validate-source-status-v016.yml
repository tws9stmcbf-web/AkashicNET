name: Validate v0.16 source status

on:
  pull_request:
    paths:
      - "schemas/source-status-v0.16.schema.json"
      - "references/source-status-fixture-v0.16*.json"
      - "references/fixtures/source-status-synthetic-scenarios-v0.16.md"
      - "scripts/validate_source_status_v016.py"
      - "tests/test_source_status_v016.py"
      - ".github/workflows/validate-source-status-v016.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Restore pip cache without saving
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.12-pip-${{ hashFiles('tests/test_source_status_v016.py') }}
      - name: Cache pip for trusted manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.12-pip-${{ hashFiles('tests/test_source_status_v016.py') }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate bounded fixture
        run: python scripts/validate_source_status_v016.py
      - name: Run mutation tests
        run: python -m pytest -q tests/test_source_status_v016.py
