name: Validate Reddit Research Companion

on:
  pull_request:
    paths:
      - 'apps/reddit-research-companion/**'
      - '.github/workflows/validate-devvit-companion.yml'
      - '.githooks/pre-commit'
  push:
    branches: [main]
    paths:
      - 'apps/reddit-research-companion/**'
      - '.github/workflows/validate-devvit-companion.yml'
      - '.githooks/pre-commit'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/reddit-research-companion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/reddit-research-companion/package-lock.json
      - name: Reject metadata exports in Git and proposed history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          node tools/check-metadata-publication.mjs
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            node tools/check-metadata-publication.mjs --range "$BASE_SHA..$HEAD_SHA"
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
