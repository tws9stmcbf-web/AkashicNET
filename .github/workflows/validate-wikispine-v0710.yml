name: Validate WikiSpine historical figures v0.7.10

on:
  pull_request:
    paths:
      - 'references/community/wikispine-batch-k-historical-figures-v0.7.10.json'
      - 'references/community/wikispine-entity-aggregate-v0.7.10.json'
      - 'scripts/validate_wikispine_v0710.py'
      - '.github/workflows/validate-wikispine-v0710.yml'
  push:
    branches: [main]
    paths:
      - 'references/community/wikispine-batch-k-historical-figures-v0.7.10.json'
      - 'references/community/wikispine-entity-aggregate-v0.7.10.json'
      - 'scripts/validate_wikispine_v0710.py'
      - '.github/workflows/validate-wikispine-v0710.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_wikispine_v0710.py
