name: N2N WikiSpine Match v0.1
on:
  push:
    paths:
      - 'scripts/n2n_wikispine_match_v01.py'
      - 'references/community/reddit-uri-index.csv'
      - 'references/topics/wikispine-topic-identities-v0.7.4.json'
      - '.github/workflows/n2n-wikispine-match-v01.yml'
  workflow_dispatch:
jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match canonical WikiSpine vocabulary against N2N slugs
        run: python scripts/n2n_wikispine_match_v01.py
      - uses: actions/upload-artifact@v4
        with:
          name: n2n-wikispine-match-v0.1
          path: |
            artifacts/n2n-wikispine-match-v0.1.csv
            artifacts/n2n-wikispine-match-v0.1.json
