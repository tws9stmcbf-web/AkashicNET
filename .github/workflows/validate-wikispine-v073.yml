name: Validate WikiSpine science expansion v0.7.3

on:
  pull_request:
    paths:
      - 'references/community/wikispine-batch-e-science-v0.7.3.json'
      - 'references/community/wikispine-aggregate-v0.7.3.json'
      - 'scripts/validate_wikispine_v073.py'
      - '.github/workflows/validate-wikispine-v073.yml'
  push:
    branches: [ main ]
    paths:
      - 'references/community/wikispine-batch-e-science-v0.7.3.json'
      - 'references/community/wikispine-aggregate-v0.7.3.json'
      - 'scripts/validate_wikispine_v073.py'
      - '.github/workflows/validate-wikispine-v073.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_wikispine_v073.py
