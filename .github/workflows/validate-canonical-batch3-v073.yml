name: Validate canonical batch 3 v0.7.3

on:
  pull_request:
    paths:
      - 'references/community/canonical-adjudication-batch3-v0.7.3.json'
      - 'scripts/validate_canonical_batch3_v073.py'
      - 'scripts/validate_canonical_adjudication_v070.py'
      - '.github/workflows/validate-canonical-batch3-v073.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Validate generic canonical contract
        run: python scripts/validate_canonical_adjudication_v070.py references/community/canonical-adjudication-batch3-v0.7.3.json
      - name: Validate batch 3 invariants
        run: python scripts/validate_canonical_batch3_v073.py
