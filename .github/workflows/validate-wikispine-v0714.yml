name: Validate WikiSpine v0.7.14

on:
  pull_request:
    paths:
      - 'references/community/wikispine-batch-o-humanistic-psychology-v0.7.14.json'
      - 'references/community/wikispine-entity-aggregate-v0.7.14.json'
      - 'references/community/wikispine-entity-aggregate-v0.7.13.json'
      - 'scripts/validate_wikispine_v0714.py'
      - '.github/workflows/validate-wikispine-v0714.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate WikiSpine v0.7.14
        run: python scripts/validate_wikispine_v0714.py
