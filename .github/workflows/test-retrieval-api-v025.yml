name: Test retrieval API v0.25

on:
  push:
    branches: [akashicnet-validation-descendants]
  pull_request:
    branches: [main]

jobs:
  retrieval-api-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build prerequisite layers
        run: |
          python scripts/build_knowledge_graph_v02.py
          python scripts/build_knowledge_graph_v03.py
          python scripts/overlay_canonical_reconciliation_v04.py
          python scripts/overlay_evidence_provenance_v05.py
          python scripts/build_cross_source_graph_v07.py
          python scripts/build_concept_layer_v010.py
          python scripts/adjudicate_concept_edges_v011.py
          python scripts/complete_collection_provenance_v013.py
          python scripts/overlay_manifestation_provenance_v014.py
          python scripts/overlay_hash_evidence_v015.py
          python scripts/apply_hash_results_v016.py
          python scripts/build_dedup_retrieval_view_v017.py
          python scripts/extend_concept_layer_v020.py
          python scripts/index_expanded_concepts_v021.py
          python scripts/normalise_semantic_representations_v022.py
      - name: Validate API schema and fixtures
        run: |
          python - <<'PY'
          import json,subprocess
          schema=json.load(open('references/community/unified-retrieval-schema-v0.25.json'))
          spec=json.load(open('references/community/retrieval-fixtures-v0.25.json'))

          assert schema['$id']==spec['schema_id']=='akashicnet://schemas/retrieval/v0.25'
          required=set(schema['required'])
          observed={}

          for f in spec['fixtures']:
              cmd=['python','scripts/query_api_v025.py',f['query'],'--domain',f['domain'],'--state',f['state']]
              d=json.loads(subprocess.check_output(cmd,text=True))
              assert required.issubset(d)
              assert d['api']=='AKASHICNET_RETRIEVAL_API'
              assert d['api_version']=='0.25'
              assert d['schema_id']==schema['$id']
              assert d['compatibility']['source_contract']=='AKASHICNET_UNIFIED_RETRIEVAL'
              assert d['compatibility']['source_contract_version']=='0.24'
              assert d['compatibility']['semantic_decisions_preserved'] is True
              assert d['compatibility']['provenance_ranking_preserved'] is True

              inv=spec['invariants']
              for key in ['archive_mode','truth_inference_allowed','rights_promotion_allowed','scientific_evidence_promotion_allowed','ranking_changes_semantic_decision','direct_metadata_lookup_is_not_semantic_acceptance','hold_results_are_explicitly_addressable']:
                  assert d['policy'][key]==inv[key]
              ranks=[r['evidence_profile']['provenance_rank'] for r in d['results']]
              assert ranks==sorted(ranks,reverse=True)
              for r in d['results']:
                  g=r['contract_guards']
                  assert g['ranking_changes_semantic_decision'] is False
                  assert g['not_truth_claim'] is True
                  assert g['not_scientific_evidence_claim'] is True
                  assert g['not_rights_clearance_claim'] is True
                  assert g['not_safety_or_efficacy_claim'] is True

              e=f['expect']; rows=d['results']
              if e.get('non_empty'): assert rows
              if 'minimum_results' in e: assert len(rows)>=e['minimum_results']
              if 'top_semantic_decision' in e: assert rows[0]['semantic_decision']==e['top_semantic_decision']
              if 'top_provenance_tier' in e: assert rows[0]['evidence_profile']['provenance_tier']==e['top_provenance_tier']
              if 'allowed_semantic_decisions' in e: assert all(r['semantic_decision'] in set(e['allowed_semantic_decisions']) for r in rows)
              if 'all_semantic_decisions' in e: assert all(r['semantic_decision']==e['all_semantic_decisions'] for r in rows)
              if 'all_domains' in e: assert all(r['domain']==e['all_domains'] for r in rows)
              observed[f['id']]=len(rows)

          print('AKASHICNET v0.25 PASS', {'fixtures':observed,'schema':schema['$id'],'truth_inference':False,'rights_promotion':False,'scientific_evidence_promotion':False})
          PY
