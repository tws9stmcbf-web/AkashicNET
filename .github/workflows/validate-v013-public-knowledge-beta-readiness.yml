name: Validate v0.13 Public Knowledge Beta readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Audit v0.13 Public Knowledge Beta readiness
        run: python scripts/audit_public_knowledge_beta_readiness_v013.py
      - name: Re-run v0.12 Integration Beta readiness
        run: python scripts/audit_integration_beta_readiness_v012.py
      - name: Re-run Big Questions architecture gate
        run: python scripts/validate_big_question_architecture_v01.py
      - name: Re-run Public Knowledge link integrity gate
        run: python scripts/validate_public_knowledge_link_integrity_v013.py
      - name: Re-run Public Knowledge batch3 gates
        run: |
          python scripts/validate_public_knowledge_release_manifest_v013.py
          python scripts/validate_public_route_qa_v013.py
          python scripts/validate_support_evidence_boundary_v013.py
      - name: Re-run immutable Actions gate
        run: python scripts/validate_actions_immutable_refs.py
      - name: Re-run public data boundary
        run: python scripts/check_public_data_boundary.py
