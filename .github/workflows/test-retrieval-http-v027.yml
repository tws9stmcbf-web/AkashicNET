name: Test retrieval HTTP adapter v0.27

on:
  push:
    branches: [akashicnet-validation-descendants]
  pull_request:
    branches: [main]

jobs:
  retrieval-http-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build prerequisite layers
        run: |
          python scripts/build_knowledge_graph_v02.py
          python scripts/build_knowledge_graph_v03.py
          python scripts/overlay_canonical_reconciliation_v04.py
          python scripts/overlay_evidence_provenance_v05.py
          python scripts/build_cross_source_graph_v07.py
          python scripts/build_concept_layer_v010.py
          python scripts/adjudicate_concept_edges_v011.py
          python scripts/complete_collection_provenance_v013.py
          python scripts/overlay_manifestation_provenance_v014.py
          python scripts/overlay_hash_evidence_v015.py
          python scripts/apply_hash_results_v016.py
          python scripts/build_dedup_retrieval_view_v017.py
          python scripts/extend_concept_layer_v020.py
          python scripts/index_expanded_concepts_v021.py
          python scripts/normalise_semantic_representations_v022.py
      - name: Assert HTTP consumer behaviour
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE='http://127.0.0.1:8787'
          proc=subprocess.Popen(['python','scripts/retrieval_http_v027.py','--host','127.0.0.1','--port','8787'])
          try:
              for _ in range(50):
                  try:
                      with urllib.request.urlopen(BASE+'/health',timeout=1) as r:
                          if r.status==200:
                              break
                  except Exception:
                      time.sleep(0.1)
              else:
                  raise AssertionError('HTTP adapter did not become ready')

              def get(path):
                  with urllib.request.urlopen(BASE+path,timeout=10) as r:
                      return r.status,json.load(r)

              status,health=get('/health')
              assert status==200
              assert health['service']=='AKASHICNET_RETRIEVAL_HTTP'
              assert health['service_version']=='0.27'
              assert health['upstream_api']=='AKASHICNET_RETRIEVAL_API'
              assert health['upstream_schema']=='akashicnet://schemas/retrieval/v0.25'
              assert health['epistemic_policy']['truth_inference_allowed'] is False
              assert health['epistemic_policy']['rights_promotion_allowed'] is False
              assert health['epistemic_policy']['scientific_evidence_promotion_allowed'] is False

              def retrieve(term,**params):
                  q={'q':term,**params}
                  status,payload=get('/v1/retrieve?'+urllib.parse.urlencode(q))
                  assert status==200
                  assert payload['service']=='AKASHICNET_RETRIEVAL_HTTP'
                  assert payload['service_version']=='0.27'
                  assert payload['transport']=='http-json'
                  upstream=payload['upstream']
                  assert upstream['api']=='AKASHICNET_RETRIEVAL_API'
                  assert upstream['api_version']=='0.25'
                  assert upstream['schema_id']=='akashicnet://schemas/retrieval/v0.25'
                  assert upstream['policy']['truth_inference_allowed'] is False
                  assert upstream['policy']['rights_promotion_allowed'] is False
                  assert upstream['policy']['scientific_evidence_promotion_allowed'] is False
                  assert upstream['policy']['ranking_changes_semantic_decision'] is False
                  for r in upstream['results']:
                      assert r['contract_guards']['not_truth_claim'] is True
                      assert r['contract_guards']['not_rights_clearance_claim'] is True
                      assert r['contract_guards']['not_scientific_evidence_claim'] is True
                  return upstream

              golden=retrieve('Golden Book of Wisdom',state='accepted',limit=5)
              holds=retrieve('Consciousness',state='hold',limit=5)
              reddit=retrieve('Psychedelics',domain='reddit',state='accepted',limit=5)

              assert golden['results'][0]['semantic_decision']=='DIRECT_METADATA_LOOKUP'
              assert golden['results'][0]['evidence_profile']['provenance_tier']=='P3_SHA256_IDENTITY_PROVENANCE'
              assert holds['results'] and all(r['semantic_decision']=='HOLD' for r in holds['results'])
              assert reddit['results'] and all(r['domain']=='reddit' and r['semantic_decision']=='ACCEPT' for r in reddit['results'])

              for path in ('/v1/retrieve','/v1/retrieve?q=test&domain=invalid'):
                  try:
                      urllib.request.urlopen(BASE+path,timeout=5)
                  except urllib.error.HTTPError as e:
                      body=json.load(e)
                      assert e.code==400
                      assert body['error']=='invalid_request'
                  else:
                      raise AssertionError('invalid request should fail')

              print('AKASHICNET v0.27 PASS',{
                  'service':'AKASHICNET_RETRIEVAL_HTTP',
                  'service_version':'0.27',
                  'upstream_api':'0.25',
                  'golden_decision':golden['results'][0]['semantic_decision'],
                  'golden_provenance':golden['results'][0]['evidence_profile']['provenance_tier'],
                  'hold_sample':len(holds['results']),
                  'reddit_sample':len(reddit['results']),
                  'truth_inference':False,
                  'rights_promotion':False,
                  'scientific_evidence_promotion':False,
              })
          finally:
              proc.terminate()
              proc.wait(timeout=5)
          PY
