name: Test expanded concept index v0.21

on:
  push:
    branches: [akashicnet-validation-descendants]
  pull_request:
    branches: [main]

jobs:
  expanded-concept-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build prerequisite layers
        run: |
          python scripts/build_knowledge_graph_v02.py
          python scripts/build_knowledge_graph_v03.py
          python scripts/overlay_canonical_reconciliation_v04.py
          python scripts/overlay_evidence_provenance_v05.py
          python scripts/build_cross_source_graph_v07.py
          python scripts/build_concept_layer_v010.py
          python scripts/adjudicate_concept_edges_v011.py
          python scripts/complete_collection_provenance_v013.py
          python scripts/overlay_manifestation_provenance_v014.py
          python scripts/overlay_hash_evidence_v015.py
          python scripts/apply_hash_results_v016.py
          python scripts/build_dedup_retrieval_view_v017.py
          python scripts/extend_concept_layer_v020.py
          python scripts/index_expanded_concepts_v021.py
      - name: Assert expanded cross-source concept indexing
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/concept-layer-v0.21.json',encoding='utf-8'))
          assert d['version']=='0.21'
          assert d['concept_count']==15
          assert d['reddit_records_examined']==1000
          assert d['truth_inference_allowed'] is False
          assert d['rights_promotion_allowed'] is False
          assert d['scientific_evidence_promotion_allowed'] is False
          nr=[e for e in d['reddit_edges'] if e.get('v021_decision')]
          nl=[e for e in d['library_edges'] if e.get('v021_decision')]
          assert len(nr)==d['v021_new_reddit_candidates']
          assert len(nl)==d['v021_new_library_candidates']
          assert len({(e['source_ref'],e['target_concept']) for e in d['reddit_edges']})==len(d['reddit_edges'])
          assert len({(e['source_ref'],e['target_concept']) for e in d['library_edges']})==len(d['library_edges'])
          for e in nr:
              if e['v021_decision']=='ACCEPT':
                  assert e['matched_field']=='title' and e['relationship']=='ABOUT' and e['accepted_edge'] is True
              else:
                  assert e['v021_decision']=='HOLD' and e['matched_field']=='short_summary' and e['accepted_edge'] is False
          assert all(e['v021_decision']=='ACCEPT' and e['matched_field']=='canonical_label' and e['accepted_edge'] is True for e in nl)
          print('AKASHICNET v0.21 INDEX PASS', {'new_reddit':len(nr),'new_library':len(nl),'decisions':d['v021_decision_counts'],'accepted_total':d['accepted_edge_count']})
          PY
      - name: Assert expanded ontology retrieval remains provenance aware
        run: |
          python - <<'PY'
          import json,subprocess
          def q(term):
              return json.loads(subprocess.check_output(['python','scripts/query_multihop_v021.py',term,'--accepted-only'],text=True))
          herm=q('Hermeticism'); qab=q('Qabbalah')
          assert herm['version']=='0.21' and qab['version']=='0.21'
          assert herm['matched_concepts'] and qab['matched_concepts']
          assert herm['logical_units_returned']>=3 and herm['physical_manifestations_returned']>=3
          assert qab['logical_units_returned']>=2 and qab['physical_manifestations_returned']>=2
          for d in [herm,qab]:
              assert d['truth_inference_allowed'] is False
              assert d['rights_promotion_allowed'] is False
              assert d['scientific_evidence_promotion_allowed'] is False
          print('AKASHICNET v0.21 RETRIEVAL PASS', {'hermeticism_results':herm['result_count'],'qabbalah_results':qab['result_count']})
          PY
