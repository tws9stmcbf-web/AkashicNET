name: Validate v0.13 Public Knowledge batch3

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Validate release manifest contract
        run: python scripts/validate_public_knowledge_release_manifest_v013.py
      - name: Validate repository-testable public route QA
        run: python scripts/validate_public_route_qa_v013.py
      - name: Validate support/evidence boundary
        run: python scripts/validate_support_evidence_boundary_v013.py
