name: Validate topic census candidate v0.7.6

on:
  pull_request:
    paths:
      - "scripts/topic_census_v076.py"
      - "tests/test_topic_census_v076.py"
      - "references/community/topic-census-candidate-v0.7.6.json"
      - "references/community/topic-census-candidate-method-v0.7.6.md"
      - "references/community/wikipedia-akashic-pilot.csv"
      - ".github/workflows/validate-topic-census-v076.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run candidate topic census
        run: python scripts/topic_census_v076.py
      - name: Validate candidate census contract
        run: python tests/test_topic_census_v076.py
