name: Validate P1 small batch5 hash evidence v0.6.11

on:
  pull_request:
    paths:
      - 'references/community/drive-p1-small-batch5-hash-summary-v0.6.11.json'
      - 'scripts/validate_p1_small_batch5_v0611.py'
      - '.github/workflows/validate-p1-small-batch5-v0611.yml'
  push:
    branches: [ main ]
    paths:
      - 'references/community/drive-p1-small-batch5-hash-summary-v0.6.11.json'
      - 'scripts/validate_p1_small_batch5_v0611.py'
      - '.github/workflows/validate-p1-small-batch5-v0611.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_p1_small_batch5_v0611.py
      - run: python scripts/check_public_data_boundary.py
