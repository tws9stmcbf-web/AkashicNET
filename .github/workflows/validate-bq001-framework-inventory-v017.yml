name: Validate BQ001 v0.17 Framework Inventory

on:
  pull_request:
    paths:
      - 'references/big-questions/BQ001/framework-inventory-v0.17-slice1.json'
      - 'references/big-questions/BQ001/spec-v0.1.json'
      - 'references/big-questions/BQ001/public-synthesis-v0.1.json'
      - 'references/big-questions/BQ001/evidence-batch1-v0.1.json'
      - 'references/big-questions/BQ001/evidence-batch2-v0.1.json'
      - 'references/big-questions/BQ001/evidence-batch3-v0.1.json'
      - 'references/big-questions/BQ001/evidence-batch4-v0.1.json'
      - 'references/big-questions/BQ001/evidence-batch5-v0.1.json'
      - 'schemas/bq001-framework-inventory-v0.17-slice1.schema.json'
      - 'scripts/validate_bq001_framework_inventory_v017.py'
      - 'tests/test_bq001_framework_inventory_v017.py'
      - '.github/workflows/validate-bq001-framework-inventory-v017.yml'
  push:
    branches: [main]
    paths:
      - 'references/big-questions/BQ001/framework-inventory-v0.17-slice1.json'
      - 'references/big-questions/BQ001/spec-v0.1.json'
      - 'references/big-questions/BQ001/public-synthesis-v0.1.json'
      - 'references/big-questions/BQ001/evidence-batch1-v0.1.json'
      - 'references/big-questions/BQ001/evidence-batch2-v0.1.json'
      - 'references/big-questions/BQ001/evidence-batch3-v0.1.json'
      - 'references/big-questions/BQ001/evidence-batch4-v0.1.json'
      - 'references/big-questions/BQ001/evidence-batch5-v0.1.json'
      - 'schemas/bq001-framework-inventory-v0.17-slice1.schema.json'
      - 'scripts/validate_bq001_framework_inventory_v017.py'
      - 'tests/test_bq001_framework_inventory_v017.py'
      - '.github/workflows/validate-bq001-framework-inventory-v017.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify tested commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Install JSON Schema validator
        run: python -m pip install jsonschema==4.25.1
      - name: Validate pinned framework inventory
        run: python scripts/validate_bq001_framework_inventory_v017.py
      - name: Verify schema, provenance, independence and governance mutations
        run: python -m unittest tests.test_bq001_framework_inventory_v017
