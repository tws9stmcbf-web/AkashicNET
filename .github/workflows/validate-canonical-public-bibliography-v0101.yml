name: Validate canonical public bibliography v0.10.1

on:
  pull_request:
    paths:
      - "references/community/canonical-adjudication-public-bibliography-v0.10.1.json"
      - "references/community/canonical-adjudication-public-bibliography-checkpoint-v0.10.1.md"
      - "scripts/validate_canonical_public_bibliography_v0101.py"
      - ".github/workflows/validate-canonical-public-bibliography-v0101.yml"
  push:
    branches: [main]
    paths:
      - "references/community/canonical-adjudication-public-bibliography-v0.10.1.json"
      - "references/community/canonical-adjudication-public-bibliography-checkpoint-v0.10.1.md"
      - "scripts/validate_canonical_public_bibliography_v0101.py"
      - ".github/workflows/validate-canonical-public-bibliography-v0101.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Validate generic canonical contract
        run: python scripts/validate_canonical_adjudication_v070.py references/community/canonical-adjudication-public-bibliography-v0.10.1.json
      - name: Validate single public-bibliography promotion
        run: python scripts/validate_canonical_public_bibliography_v0101.py references/community/canonical-adjudication-public-bibliography-v0.10.1.json
