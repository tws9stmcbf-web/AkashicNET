name: Test multi-hop retrieval v0.12 + provenance v0.13

on:
  push:
    branches: [akashicnet-validation-descendants]
  pull_request:
    branches: [main]

jobs:
  multihop-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build graph through v0.13
        run: |
          python scripts/build_knowledge_graph_v02.py
          python scripts/build_knowledge_graph_v03.py
          python scripts/overlay_canonical_reconciliation_v04.py
          python scripts/overlay_evidence_provenance_v05.py
          python scripts/build_cross_source_graph_v07.py
          python scripts/build_concept_layer_v010.py
          python scripts/adjudicate_concept_edges_v011.py
          python scripts/complete_collection_provenance_v013.py
      - name: Assert multi-hop retrieval safety and provenance
        run: |
          python - <<'PY'
          import json,subprocess
          resolved_library_paths=0
          unresolved_library_paths=0
          total_paths=0
          per_term={}
          for term in ['psychedelics','shamanism','hinduism','alchemy']:
              raw=subprocess.check_output(['python','scripts/query_multihop_v012.py',term,'--accepted-only'],text=True)
              d=json.loads(raw)
              assert d['version']=='0.12'
              assert d['truth_inference_allowed'] is False
              assert d['rights_promotion_allowed'] is False
              assert d['scientific_evidence_promotion_allowed'] is False
              per_term[term]=d['path_count']
              total_paths+=d['path_count']
              for p in d['paths']:
                  assert p['hops']
                  assert p['hops'][0]['relationship']=='ABOUT'
                  assert p['hops'][0]['decision']=='ACCEPT'
                  if p['domain']=='library':
                      assert p['provenance_resolution'] in {'DRIVE_MEMBER_LINK_RESOLVED','PROVENANCE_NOT_YET_LINKED'}
                      if p['provenance_resolution']=='DRIVE_MEMBER_LINK_RESOLVED':
                          resolved_library_paths+=1
                          assert 'drive_provenance' in p
                          assert len(p['hops'])>=2
                          assert p['hops'][1]['relationship']=='HAS_PROVENANCE_MEMBER'
                      else:
                          unresolved_library_paths+=1
                          assert 'drive_provenance' not in p
          assert per_term['psychedelics']>0
          assert total_paths>0
          assert resolved_library_paths>0
          print('AKASHICNET v0.12 PASS', {'per_term':per_term,'resolved_library_paths':resolved_library_paths,'unresolved_library_paths':unresolved_library_paths})
          PY
      - name: Assert v0.13 collection provenance boundaries
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/knowledge-graph-v0.13.json',encoding='utf-8'))
          p=d['provenance_completion_v013']
          assert d['schema_version']=='0.13'
          assert sum(1 for n in d['nodes'] if n.get('node_type')=='drive_object')==195
          assert p['candidate_families_examined']==29
          assert p['exact_collection_edges_added']>0
          assert p['truth_inference_allowed'] is False
          assert p['rights_promotion_allowed'] is False
          assert p['scientific_evidence_promotion_allowed'] is False
          assert p['integrity_pass'] is True
          assert d['integrity']['release_integrity_pass'] is True
          for e in d['edges']:
              if e.get('relationship')=='PROVENANCE_RECORDED_IN_COLLECTION':
                  assert e['provenance_level']=='collection_only'
                  assert e['not_document_identity'] is True
                  assert e['not_truth_claim'] is True
          print('AKASHICNET v0.13 PASS', {
              'edges_added':p['exact_collection_edges_added'],
              'fully_resolved':p['fully_resolved_collection_provenance'],
              'partial':p['partial_collection_provenance'],
              'holds':p['holds'],
              'unresolved':p['unresolved']})
          PY
