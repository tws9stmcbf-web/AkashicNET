name: Validate IONS presentation rights

on:
  push:
    branches: [main]
    paths:
      - "references/community/ions-vision-for-humanity-rights.json"
      - "tests/test_ions_presentation_rights.py"
      - ".github/workflows/validate-ions-presentation-rights.yml"
  pull_request:
    paths:
      - "references/community/ions-vision-for-humanity-rights.json"
      - "tests/test_ions_presentation_rights.py"
      - ".github/workflows/validate-ions-presentation-rights.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rights-conditions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Preserve presentation-specific permission boundaries
        run: python -m unittest discover -s tests -p 'test_ions_presentation_rights.py' -v
