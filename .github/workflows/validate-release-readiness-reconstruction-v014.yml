name: Validate v0.14 release readiness reconstruction

on:
  pull_request:
    paths:
      - 'references/community/release-readiness-reconstruction-v0.14.json'
      - 'references/community/release-ledger-v0.14.json'
      - 'references/community/public-knowledge-beta-release-manifest-v0.13.json'
      - 'references/community/public-knowledge-beta-readiness-v0.13.json'
      - 'references/community/integration-beta-readiness-v0.12.json'
      - 'references/big-questions/architecture-v0.1.json'
      - 'scripts/validate_release_readiness_reconstruction_v014.py'
      - 'scripts/validate_release_ledger_v014.py'
      - 'scripts/audit_public_knowledge_beta_readiness_v013.py'
      - 'scripts/validate_public_knowledge_release_manifest_v013.py'
      - 'scripts/validate_public_route_qa_v013.py'
      - 'scripts/validate_support_evidence_boundary_v013.py'
      - 'scripts/validate_public_knowledge_link_integrity_v013.py'
      - 'scripts/audit_integration_beta_readiness_v012.py'
      - 'scripts/validate_big_question_architecture_v01.py'
      - 'scripts/validate_actions_immutable_refs.py'
      - 'scripts/check_public_data_boundary.py'
      - '.github/workflows/validate-release-readiness-reconstruction-v014.yml'
  push:
    branches: [main]
    paths:
      - 'references/community/release-readiness-reconstruction-v0.14.json'
      - 'references/community/release-ledger-v0.14.json'
      - 'references/community/public-knowledge-beta-release-manifest-v0.13.json'
      - 'references/community/public-knowledge-beta-readiness-v0.13.json'
      - 'references/community/integration-beta-readiness-v0.12.json'
      - 'references/big-questions/architecture-v0.1.json'
      - 'scripts/validate_release_readiness_reconstruction_v014.py'
      - 'scripts/validate_release_ledger_v014.py'
      - 'scripts/audit_public_knowledge_beta_readiness_v013.py'
      - 'scripts/validate_public_knowledge_release_manifest_v013.py'
      - 'scripts/validate_public_route_qa_v013.py'
      - 'scripts/validate_support_evidence_boundary_v013.py'
      - 'scripts/validate_public_knowledge_link_integrity_v013.py'
      - 'scripts/audit_integration_beta_readiness_v012.py'
      - 'scripts/validate_big_question_architecture_v01.py'
      - 'scripts/validate_actions_immutable_refs.py'
      - 'scripts/check_public_data_boundary.py'
      - '.github/workflows/validate-release-readiness-reconstruction-v014.yml'

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Validate reconstruction contract
        run: python scripts/validate_release_readiness_reconstruction_v014.py
      - name: Validate release ledger
        run: python scripts/validate_release_ledger_v014.py
      - name: Re-run v0.13 readiness
        run: |
          python scripts/audit_public_knowledge_beta_readiness_v013.py
          python scripts/validate_public_knowledge_release_manifest_v013.py
          python scripts/validate_public_route_qa_v013.py
          python scripts/validate_support_evidence_boundary_v013.py
          python scripts/validate_public_knowledge_link_integrity_v013.py
      - name: Re-run v0.12 readiness
        run: python scripts/audit_integration_beta_readiness_v012.py
      - name: Re-run Big Questions architecture
        run: python scripts/validate_big_question_architecture_v01.py
      - name: Re-run public data boundary
        run: python scripts/check_public_data_boundary.py
      - name: Re-run immutable Actions gate
        run: python scripts/validate_actions_immutable_refs.py
