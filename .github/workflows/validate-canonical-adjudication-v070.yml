name: Validate canonical adjudication v0.7.0

on:
  pull_request:
    paths:
      - "docs/CANONICAL_ADJUDICATION_CONTRACT_V070.md"
      - "scripts/validate_canonical_adjudication_v070.py"
      - "references/community/canonical-adjudication-example-v0.7.0.json"
      - ".github/workflows/validate-canonical-adjudication-v070.yml"
  push:
    branches: [main]
    paths:
      - "docs/CANONICAL_ADJUDICATION_CONTRACT_V070.md"
      - "scripts/validate_canonical_adjudication_v070.py"
      - "references/community/canonical-adjudication-example-v0.7.0.json"
      - ".github/workflows/validate-canonical-adjudication-v070.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Validate example adjudication payload
        run: python scripts/validate_canonical_adjudication_v070.py references/community/canonical-adjudication-example-v0.7.0.json
