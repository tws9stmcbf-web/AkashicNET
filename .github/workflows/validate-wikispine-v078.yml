name: Validate WikiSpine researcher batch v0.7.8

on:
  pull_request:
    paths:
      - 'references/community/wikispine-batch-i-researchers-v0.7.8.json'
      - 'references/community/wikispine-entity-aggregate-v0.7.8.json'
      - 'scripts/validate_wikispine_v078.py'
      - '.github/workflows/validate-wikispine-v078.yml'
  push:
    paths:
      - 'references/community/wikispine-batch-i-researchers-v0.7.8.json'
      - 'references/community/wikispine-entity-aggregate-v0.7.8.json'
      - 'scripts/validate_wikispine_v078.py'
      - '.github/workflows/validate-wikispine-v078.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate WikiSpine researcher batch
        run: python scripts/validate_wikispine_v078.py
