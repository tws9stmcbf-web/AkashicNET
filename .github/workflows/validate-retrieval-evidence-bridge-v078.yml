name: Validate retrieval evidence bridge v0.7.8

on:
  pull_request:
    paths:
      - 'scripts/validate_retrieval_evidence_bridge_v078.py'
      - 'tests/test_retrieval_evidence_bridge_v078.py'
      - 'scripts/validate_retrieval_api_compat_v026.py'
      - 'tests/test_retrieval_api_compat_v026.py'
      - 'tests/test_filtered_retrieval_continuity_v01.py'
      - 'tests/test_actual_retrieval_continuity_v01.py'
      - 'tests/test_public_retrieval_boundary_v01.py'
      - 'scripts/query_public_v01.py'
      - 'scripts/public_retrieval_snapshot_v01.py'
      - 'tests/fixtures/filtered-retrieval-continuity-v0.1.json'
      - 'scripts/check_public_data_boundary.py'
      - 'scripts/retrieval_evidence_v01.py'
      - 'tests/test_retrieval_evidence_filter_v01.py'
      - 'tests/test_retrieval_tie_break_v01.py'
      - 'tests/test_reddit_review_reference_v01.py'
      - 'scripts/query_api_v025.py'
      - 'scripts/query_unified_v024.py'
      - 'scripts/query_ranked_v023.py'
      - 'scripts/query_multihop_v022.py'
      - 'scripts/normalise_semantic_representations_v022.py'
      - 'references/community/unified-retrieval-schema-v0.25.json'
      - 'references/community/retrieval-fixtures-v0.25.json'
      - 'references/community/retrieval-api-compatibility-policy-v0.26.md'
      - 'docs/canonical-evidence-v01.md'
      - '.github/workflows/validate-retrieval-evidence-bridge-v078.yml'
      - '.github/workflows/actions.lock'
      - '.github/dependency-records/retrieval-validation-python-v078.*'
  push:
    branches: [main]
    paths:
      - 'scripts/validate_retrieval_evidence_bridge_v078.py'
      - 'tests/test_retrieval_evidence_bridge_v078.py'
      - 'scripts/validate_retrieval_api_compat_v026.py'
      - 'tests/test_retrieval_api_compat_v026.py'
      - 'tests/test_filtered_retrieval_continuity_v01.py'
      - 'tests/test_actual_retrieval_continuity_v01.py'
      - 'tests/test_public_retrieval_boundary_v01.py'
      - 'scripts/query_public_v01.py'
      - 'scripts/public_retrieval_snapshot_v01.py'
      - 'tests/fixtures/filtered-retrieval-continuity-v0.1.json'
      - 'scripts/check_public_data_boundary.py'
      - 'scripts/retrieval_evidence_v01.py'
      - 'tests/test_retrieval_evidence_filter_v01.py'
      - 'tests/test_retrieval_tie_break_v01.py'
      - 'tests/test_reddit_review_reference_v01.py'
      - 'scripts/query_api_v025.py'
      - 'scripts/query_unified_v024.py'
      - 'scripts/query_ranked_v023.py'
      - 'scripts/query_multihop_v022.py'
      - 'scripts/normalise_semantic_representations_v022.py'
      - 'references/community/unified-retrieval-schema-v0.25.json'
      - 'references/community/retrieval-fixtures-v0.25.json'
      - 'references/community/retrieval-api-compatibility-policy-v0.26.md'
      - 'docs/canonical-evidence-v01.md'
      - '.github/workflows/validate-retrieval-evidence-bridge-v078.yml'
      - '.github/workflows/actions.lock'
      - '.github/dependency-records/retrieval-validation-python-v078.*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # Isolate the test closure from packages preinstalled on the hosted runner.
      - name: Create isolated retrieval test environment
        run: |
          python -m venv "$RUNNER_TEMP/retrieval-python-v078"
          echo "$RUNNER_TEMP/retrieval-python-v078/bin" >> "$GITHUB_PATH"
      - name: Record tested checkout and environment
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          python --version
          python -m pip --version
          uname -m
          cat /etc/os-release
      - run: python scripts/validate_retrieval_evidence_bridge_v078.py
      - run: python scripts/validate_retrieval_api_compat_v026.py
      - name: Install locked retrieval test dependencies
        run: >-
          python -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --no-cache-dir -r .github/dependency-records/retrieval-validation-python-v078.txt
      - run: python -m pip check
      - run: python -m pip freeze --all
      # Bounded synthetic regressions; green is not backend certification.
      - run: python -m pytest -q -rx tests/test_retrieval_evidence_bridge_v078.py tests/test_retrieval_api_compat_v026.py tests/test_filtered_retrieval_continuity_v01.py tests/test_actual_retrieval_continuity_v01.py tests/test_public_retrieval_boundary_v01.py tests/test_public_data_boundary.py tests/test_retrieval_evidence_filter_v01.py tests/test_retrieval_tie_break_v01.py tests/test_reddit_review_reference_v01.py
