name: Test retrieval HTTP service v0.28

on:
  push:
    branches: [akashicnet-validation-descendants]
  pull_request:
    branches: [main]

jobs:
  retrieval-http-v028-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build prerequisite layers
        run: |
          python scripts/build_knowledge_graph_v02.py
          python scripts/build_knowledge_graph_v03.py
          python scripts/overlay_canonical_reconciliation_v04.py
          python scripts/overlay_evidence_provenance_v05.py
          python scripts/build_cross_source_graph_v07.py
          python scripts/build_concept_layer_v010.py
          python scripts/adjudicate_concept_edges_v011.py
          python scripts/complete_collection_provenance_v013.py
          python scripts/overlay_manifestation_provenance_v014.py
          python scripts/overlay_hash_evidence_v015.py
          python scripts/apply_hash_results_v016.py
          python scripts/build_dedup_retrieval_view_v017.py
          python scripts/extend_concept_layer_v020.py
          python scripts/index_expanded_concepts_v021.py
          python scripts/normalise_semantic_representations_v022.py
      - name: Assert OpenAPI and fixture-driven HTTP contract
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time
          import urllib.error
          import urllib.request

          fixture=json.load(open('tests/fixtures/retrieval-http-v0.28.json',encoding='utf-8'))
          spec=json.load(open('api/openapi-retrieval-v0.28.json',encoding='utf-8'))
          assert spec['openapi']=='3.1.0'
          assert spec['info']['version']=='0.28'
          assert set(spec['paths'])=={'/health','/openapi.json','/v1/retrieve'}
          policy=spec['x-akashicnet-policy']
          assert policy['truth_inference_allowed'] is False
          assert policy['rights_promotion_allowed'] is False
          assert policy['scientific_evidence_promotion_allowed'] is False
          assert policy['ranking_changes_semantic_decision'] is False
          assert policy['public_retrieval_requires_public_verified'] is True

          BASE='http://127.0.0.1:8787'
          proc=subprocess.Popen(['python','scripts/retrieval_http_v028.py','--host','127.0.0.1','--port','8787'])
          try:
              for _ in range(50):
                  try:
                      with urllib.request.urlopen(BASE+'/health',timeout=1) as r:
                          if r.status==200: break
                  except Exception:
                      time.sleep(0.1)
              else:
                  raise AssertionError('HTTP service did not become ready')

              def request(path):
                  try:
                      with urllib.request.urlopen(BASE+path,timeout=10) as r:
                          return r.status,json.load(r)
                  except urllib.error.HTTPError as e:
                      return e.code,json.load(e)

              def lookup(obj,dotted):
                  for part in dotted.split('.'):
                      obj=obj[part]
                  return obj

              observations={}
              for case in fixture['cases']:
                  status,payload=request(case['path'])
                  assert status==case['status'],(case['id'],status,payload)
                  for key,value in case.get('assert',{}).items():
                      assert lookup(payload,key)==value,(case['id'],key)
                  upstream=payload.get('upstream') if isinstance(payload,dict) else None
                  if upstream:
                      assert upstream['api']==fixture['upstream_api']
                      assert upstream['api_version']==fixture['upstream_api_version']
                      assert upstream['schema_id']==fixture['upstream_schema']
                      for key,value in fixture['policy'].items():
                          assert upstream['policy'][key] is value
                      for row in upstream['results']:
                          guards=row['contract_guards']
                          assert guards['not_truth_claim'] is True
                          assert guards['not_rights_clearance_claim'] is True
                          assert guards['not_scientific_evidence_claim'] is True
                  if 'assert_first_result' in case:
                      row=upstream['results'][0]
                      for key,value in case['assert_first_result'].items():
                          assert lookup(row,key)==value,(case['id'],key)
                  if 'assert_all_results' in case:
                      rows=upstream['results']
                      assert rows,case['id']
                      for row in rows:
                          for key,value in case['assert_all_results'].items():
                              assert lookup(row,key)==value,(case['id'],key)
                  observations[case['id']]=len(upstream['results']) if upstream else status

              status,runtime_spec=request('/openapi.json')
              assert status==200 and runtime_spec==spec
              print('AKASHICNET v0.28 CONTRACT PASS',{
                  'service':'AKASHICNET_RETRIEVAL_HTTP',
                  'service_version':'0.28',
                  'openapi':'3.1.0',
                  'fixture_cases':len(fixture['cases']),
                  'golden_results':observations['verified-byte-provenance'],
                  'hold_results':observations['hold-preservation'],
                  'reddit_results':observations['reddit-accepted'],
                  'truth_inference':False,
                  'rights_promotion':False,
                  'scientific_evidence_promotion':False,
              })
          finally:
              proc.terminate()
              proc.wait(timeout=5)
          PY
      - name: Build deployable container
        run: docker build -f deploy/retrieval-v0.28/Containerfile -t akashicnet-retrieval:v0.28 .
      - name: Smoke-test packaged service
        run: |
          docker run -d --rm --name akashicnet-retrieval-v028 -p 8788:8787 akashicnet-retrieval:v0.28
          python - <<'PY'
          import json,time,urllib.request
          url='http://127.0.0.1:8788/health'
          for _ in range(60):
              try:
                  with urllib.request.urlopen(url,timeout=1) as r:
                      payload=json.load(r)
                      assert payload['service_version']=='0.28'
                      assert payload['upstream_schema']=='akashicnet://schemas/retrieval/v0.25'
                      assert payload['epistemic_policy']['truth_inference_allowed'] is False
                      print('AKASHICNET v0.28 PACKAGE PASS',{'container_health':'ok','service_version':'0.28'})
                      break
              except Exception:
                  time.sleep(0.25)
          else:
              raise AssertionError('packaged service did not become healthy')
          PY
          docker stop akashicnet-retrieval-v028
