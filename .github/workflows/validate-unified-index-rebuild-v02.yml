name: Validate unified-index rebuild v0.2

on:
  pull_request:
    paths:
      - "scripts/validate_unified_index_rebuild_v02.py"
      - "references/community/unified-index-rebuild-v0.2.json"
      - "references/community/reddit-uri-index.csv"
      - "tools/akashic-library/state/audit.jsonl"
      - ".github/workflows/validate-unified-index-rebuild-v02.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Validate count-only unified-index checkpoint
        run: python scripts/validate_unified_index_rebuild_v02.py
