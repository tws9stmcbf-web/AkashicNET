name: Validate Big Question maturity v0.1

on:
  pull_request:
    paths:
      - "references/big-questions/**"
      - "website/app/big-questions/**"
      - "scripts/validate_big_question_maturity_v01.py"
      - "tests/test_big_question_maturity_v01.py"
      - ".github/workflows/validate-big-question-maturity-v01.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python scripts/validate_big_question_maturity_v01.py
      - run: python -m unittest tests/test_big_question_maturity_v01.py
