name: Test semantic representation normalisation v0.22

on:
  push:
    branches: [akashicnet-validation-descendants]
  pull_request:
    branches: [main]

jobs:
  semantic-normalisation-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build prerequisite layers
        run: |
          python scripts/build_knowledge_graph_v02.py
          python scripts/build_knowledge_graph_v03.py
          python scripts/overlay_canonical_reconciliation_v04.py
          python scripts/overlay_evidence_provenance_v05.py
          python scripts/build_cross_source_graph_v07.py
          python scripts/build_concept_layer_v010.py
          python scripts/adjudicate_concept_edges_v011.py
          python scripts/complete_collection_provenance_v013.py
          python scripts/overlay_manifestation_provenance_v014.py
          python scripts/overlay_hash_evidence_v015.py
          python scripts/apply_hash_results_v016.py
          python scripts/build_dedup_retrieval_view_v017.py
          python scripts/extend_concept_layer_v020.py
          python scripts/index_expanded_concepts_v021.py
          python scripts/normalise_semantic_representations_v022.py
      - name: Assert semantic representation normalisation
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/concept-layer-v0.22.json',encoding='utf-8'))
          assert d['version']=='0.22'
          assert d['concept_count']==15
          assert d['library_edges_post_normalisation'] <= d['library_edges_pre_normalisation']
          assert d['representation_provenance_records'] >= d['library_edges_post_normalisation']
          assert d['semantic_strength_from_representation_count'] is False
          assert d['truth_inference_allowed'] is False
          assert d['rights_promotion_allowed'] is False
          assert d['scientific_evidence_promotion_allowed'] is False
          pairs=[(e['logical_family_id'],e['target_concept']) for e in d['library_edges']]
          assert len(pairs)==len(set(pairs))
          for e in d['library_edges']:
              assert e['representation_count']==len(e['representation_sources'])
              assert e['representation_multiplicity_not_semantic_strength'] is True
          print('AKASHICNET v0.22 NORMALISATION PASS', {
              'pre':d['library_edges_pre_normalisation'],
              'post':d['library_edges_post_normalisation'],
              'multi_representation':d['multi_representation_logical_edges'],
              'provenance_records':d['representation_provenance_records']})
          PY
      - name: Assert normalised retrieval
        run: |
          python - <<'PY'
          import json,subprocess
          def q(term):
              return json.loads(subprocess.check_output(['python','scripts/query_multihop_v022.py',term,'--accepted-only'],text=True))
          herm=q('Hermeticism'); qab=q('Qabbalah')
          for d in [herm,qab]:
              assert d['version']=='0.22'
              assert d['semantic_strength_from_representation_count'] is False
              assert d['truth_inference_allowed'] is False
              assert d['rights_promotion_allowed'] is False
              assert d['scientific_evidence_promotion_allowed'] is False
              libs=[r for r in d['results'] if r['domain']=='library']
              assert libs
              assert len({(r['source']['family_id'],r['concept']) for r in libs})==len(libs)
              for r in libs:
                  assert r['concept_hop']['representation_multiplicity_not_semantic_strength'] is True
          assert herm['logical_units_returned']>=3
          assert qab['logical_units_returned']>=2
          print('AKASHICNET v0.22 RETRIEVAL PASS', {'hermeticism_results':herm['result_count'],'qabbalah_results':qab['result_count']})
          PY
