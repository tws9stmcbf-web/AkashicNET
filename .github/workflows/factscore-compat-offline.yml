name: FActScore compatibility offline
on:
  pull_request:
    paths:
      - 'scripts/factscore_compat.py'
      - 'scripts/prepare_factscore_compat.py'
      - 'tests/test_factscore_compat.py'
      - '.github/workflows/factscore-compat-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Run dependency-free offline tests (optional installed-package check skips)
        run: python -m unittest discover -s tests -p test_factscore_compat.py -v
