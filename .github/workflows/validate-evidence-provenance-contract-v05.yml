name: Validate evidence provenance contract v0.5

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "references/community/evidence-provenance-scoring-v0.1.md"
      - "scripts/overlay_evidence_provenance_v05.py"
      - "scripts/validate_evidence_provenance_contract_v05.py"
      - "tests/test_evidence_provenance_contract_v05.py"
      - ".github/workflows/validate-evidence-provenance-contract-v05.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate provenance scoring contract
        run: python scripts/validate_evidence_provenance_contract_v05.py
      - name: Run provenance contract regression tests
        run: |
          python -m pip install pytest
          pytest -q tests/test_evidence_provenance_contract_v05.py
