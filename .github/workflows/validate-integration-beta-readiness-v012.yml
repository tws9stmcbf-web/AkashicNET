name: Validate v0.12 Integration Beta readiness

on:
  pull_request:
    paths:
      - 'references/community/integration-beta-readiness-v0.12.json'
      - 'references/community/data-beta-readiness-v0.11.json'
      - 'references/big-questions/BQ001/**'
      - 'website/app/big-questions/bq001/page.tsx'
      - 'scripts/audit_integration_beta_readiness_v012.py'
      - 'scripts/validate_public_beta_integration_gate.py'
      - 'scripts/validate_actions_immutable_refs.py'
      - 'scripts/check_public_data_boundary.py'
      - 'scripts/build_cross_source_graph_v07.py'
      - '.github/workflows/**'
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Audit Integration Beta readiness
        run: python scripts/audit_integration_beta_readiness_v012.py
      - name: Re-run Public Beta integration gate
        run: python scripts/validate_public_beta_integration_gate.py
      - name: Re-run immutable Actions gate
        run: python scripts/validate_actions_immutable_refs.py
      - name: Re-run public data boundary
        run: python scripts/check_public_data_boundary.py
