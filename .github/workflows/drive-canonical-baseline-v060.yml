name: Drive canonical baseline v0.6.0

on:
  workflow_dispatch:
  push:
    paths:
      - 'references/community/drive-canonical-object-ledger-v0.6.0.csv'
      - 'references/community/drive-canonical-family-review-v0.6.0.csv'
      - 'references/community/drive-canonical-baseline-v0.6.0.json'
      - 'references/community/drive-canonical-evidence-overlay-v0.6.1.csv'
      - 'references/community/drive-canonical-evidence-summary-v0.6.1.json'
      - '.github/workflows/drive-canonical-baseline-v060.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate durable checked-in canonical baseline
        run: |
          python - <<'PY'
          import csv, json
          from collections import Counter
          from pathlib import Path

          root = Path('references/community')
          ledger = list(csv.DictReader((root/'drive-canonical-object-ledger-v0.6.0.csv').open(encoding='utf-8-sig')))
          families = list(csv.DictReader((root/'drive-canonical-family-review-v0.6.0.csv').open(encoding='utf-8-sig')))
          summary = json.loads((root/'drive-canonical-baseline-v0.6.0.json').read_text())
          overlay = list(csv.DictReader((root/'drive-canonical-evidence-overlay-v0.6.1.csv').open(encoding='utf-8-sig')))
          evidence = json.loads((root/'drive-canonical-evidence-summary-v0.6.1.json').read_text())

          assert len(ledger) == 2459
          assert len({r['drive_id'] for r in ledger}) == 2459
          assert Counter(r['disposition'] for r in ledger) == Counter({'UNIQUE_CANDIDATE':2173,'REVIEW_REQUIRED':258,'TECHNICAL_EXCLUSION':28})
          assert len(families) == 127
          assert sum(r['review_state']=='REVIEW_REQUIRED' for r in families) == 126
          assert summary['source_snapshot_objects'] == 2459
          assert evidence['baseline_objects'] == 2459
          assert evidence['hash_pairs_reconciled'] == 3
          assert evidence['byte_identical_pairs_verified'] == 3
          assert evidence['canonical_work_ids_promoted'] == 0
          assert evidence['edition_ids_promoted'] == 0
          assert len(overlay) == 17
          assert sum(r['promotion_status']=='ACCEPT_DUPLICATE_COPY' for r in overlay) == 4
          # Four overlay rows encode three unique verified pairs because Golden Book
          # appears once as Stage-B reconciliation and once as its hash record.
          assert all(r['canonical_work_id']=='' and r['edition_id']=='' for r in overlay)
          print('PASS: durable v0.6.0 baseline + v0.6.1 evidence overlay validated')
          PY

      - name: Explain frozen-source provenance
        run: |
          echo 'The checked-in 2,459-row canonical ledger is now the durable canonical baseline.'
          echo 'Historical census artifact 9713170876 remains provenance evidence, not a CI dependency.'
