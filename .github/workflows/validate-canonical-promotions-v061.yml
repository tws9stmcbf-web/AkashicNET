name: Validate canonical promotions v0.6.1

on:
  push:
    paths:
      - 'references/community/canonical-promotion-decisions-v0.6.1.csv'
      - 'references/community/canonical-work-registry-v0.6.1.csv'
      - 'references/community/canonical-graph-promotions-v0.6.1.csv'
      - 'references/community/hash-verification-results-v0.16.csv'
      - 'references/community/drive-manifestation-provenance-v0.14.csv'
      - 'scripts/validate_canonical_promotions_v061.py'
      - '.github/workflows/validate-canonical-promotions-v061.yml'
  pull_request:
    paths:
      - 'references/community/canonical-promotion-decisions-v0.6.1.csv'
      - 'references/community/canonical-work-registry-v0.6.1.csv'
      - 'references/community/canonical-graph-promotions-v0.6.1.csv'
      - 'references/community/hash-verification-results-v0.16.csv'
      - 'references/community/drive-manifestation-provenance-v0.14.csv'
      - 'scripts/validate_canonical_promotions_v061.py'
      - '.github/workflows/validate-canonical-promotions-v061.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate promotion evidence and graph integrity
        run: python scripts/validate_canonical_promotions_v061.py
