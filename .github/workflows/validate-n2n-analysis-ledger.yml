name: Validate N2N analysis ledger continuation

on:
  pull_request:
    paths:
      - references/community/n2n-analysis-ledger.json
      - references/community/reddit-uri-index.csv
      - scripts/reddit_corpus_census.py
      - tests/test_n2n_analysis_ledger.py
      - tests/test_reddit_corpus_census.py
      - .github/workflows/validate-n2n-analysis-ledger.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check offline queue and continuation regressions
        run: |
          python -m unittest discover -s tests -p 'test_n2n_analysis_ledger.py' -v
          python -m unittest discover -s tests -p 'test_reddit_corpus_census.py' -v
