name: Validate BQ001 public status boundary

on:
  pull_request:
    paths:
      - 'website/app/big-questions/bq001/page.tsx'
      - 'scripts/validate_bq001_public_status_boundary.py'
      - 'tests/test_bq001_public_status_boundary.py'
      - '.github/workflows/validate-bq001-public-status-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'website/app/big-questions/bq001/page.tsx'
      - 'scripts/validate_bq001_public_status_boundary.py'
      - 'tests/test_bq001_public_status_boundary.py'
      - '.github/workflows/validate-bq001-public-status-boundary.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_bq001_public_status_boundary.py
      - run: python -m pip install pytest
      - run: pytest -q tests/test_bq001_public_status_boundary.py
