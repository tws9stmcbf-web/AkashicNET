name: Validate BQ001 public status boundary

on:
  pull_request:
    paths:
      - 'references/big-questions/BQ001/public-synthesis-v0.1.json'
      - 'website/app/big-questions/bq001/page.tsx'
      - 'scripts/validate_bq001_public_status_boundary.py'
      - 'tests/test_bq001_public_status_boundary.py'
      - '.github/workflows/validate-bq001-public-status-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'references/big-questions/BQ001/public-synthesis-v0.1.json'
      - 'website/app/big-questions/bq001/page.tsx'
      - 'scripts/validate_bq001_public_status_boundary.py'
      - 'tests/test_bq001_public_status_boundary.py'
      - '.github/workflows/validate-bq001-public-status-boundary.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_bq001_public_status_boundary.py
      - run: python -m pip install pytest
      - run: pytest -q tests/test_bq001_public_status_boundary.py
