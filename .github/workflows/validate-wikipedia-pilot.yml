name: Validate Wikipedia pilot

on:
  push:
    paths:
      - "references/community/wikipedia-akashic-pilot.csv"
      - "tools/akashic-library/wikipedia_pilot.py"
      - "tools/validate_wikipedia_pilot.py"
      - ".github/workflows/validate-wikipedia-pilot.yml"
  pull_request:
    paths:
      - "references/community/wikipedia-akashic-pilot.csv"
      - "tools/akashic-library/wikipedia_pilot.py"
      - "tools/validate_wikipedia_pilot.py"
      - ".github/workflows/validate-wikipedia-pilot.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate public Wikipedia pilot metadata
        run: python tools/validate_wikipedia_pilot.py
