name: Audit Data Beta Readiness v0.11

on:
  push:
    paths:
      - 'references/community/data-beta-readiness-v0.11.json'
      - 'references/community/reddit-corpus-structural-checkpoint-v0.2.json'
      - 'references/community/reddit-uri-index.csv'
      - 'references/community/v010-release-checkpoint.json'
      - 'scripts/audit_data_beta_readiness_v011.py'
      - 'scripts/reddit_corpus_census.py'
      - 'scripts/validate_reddit_structural_checkpoint_v02.py'
      - 'tests/test_data_beta_readiness_v011.py'
      - 'tests/test_reddit_corpus_census.py'
      - 'README.md'
      - '.github/workflows/audit-data-beta-readiness-v011.yml'
  pull_request:
    paths:
      - 'references/community/data-beta-readiness-v0.11.json'
      - 'references/community/reddit-corpus-structural-checkpoint-v0.2.json'
      - 'references/community/reddit-uri-index.csv'
      - 'references/community/v010-release-checkpoint.json'
      - 'scripts/audit_data_beta_readiness_v011.py'
      - 'scripts/reddit_corpus_census.py'
      - 'scripts/validate_reddit_structural_checkpoint_v02.py'
      - 'tests/test_data_beta_readiness_v011.py'
      - 'tests/test_reddit_corpus_census.py'
      - 'README.md'
      - '.github/workflows/audit-data-beta-readiness-v011.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate structural Reddit checkpoint
        run: python scripts/validate_reddit_structural_checkpoint_v02.py
      - name: Run readiness auditor
        run: python scripts/audit_data_beta_readiness_v011.py
      - name: Run regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_data_beta_readiness_v011.py tests/test_reddit_corpus_census.py
