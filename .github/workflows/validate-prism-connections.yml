name: Validate PRISM connection traceability

on:
  pull_request:
    paths:
      - 'schemas/akashic-prism-v0.1.schema.json'
      - 'scripts/validate_prism_connections.py'
      - 'tests/test_prism_connections.py'
      - 'tests/fixtures/prism/**'
      - '.github/workflows/validate-prism-connections.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/akashic-prism-v0.1.schema.json'
      - 'scripts/validate_prism_connections.py'
      - 'tests/test_prism_connections.py'
      - 'tests/fixtures/prism/**'
      - '.github/workflows/validate-prism-connections.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.26.0
      - run: python scripts/validate_prism_connections.py tests/fixtures/prism/connection-traceability.json
      - run: python -m unittest discover -s tests -p 'test_prism_connections.py' -v
