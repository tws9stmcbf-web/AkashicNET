name: Test unified retrieval contract v0.24

on:
  push:
    branches: [akashicnet-validation-descendants]
  pull_request:
    branches: [main]

jobs:
  unified-retrieval-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build prerequisite layers
        run: |
          python scripts/build_knowledge_graph_v02.py
          python scripts/build_knowledge_graph_v03.py
          python scripts/overlay_canonical_reconciliation_v04.py
          python scripts/overlay_evidence_provenance_v05.py
          python scripts/build_cross_source_graph_v07.py
          python scripts/build_concept_layer_v010.py
          python scripts/adjudicate_concept_edges_v011.py
          python scripts/complete_collection_provenance_v013.py
          python scripts/overlay_manifestation_provenance_v014.py
          python scripts/overlay_hash_evidence_v015.py
          python scripts/apply_hash_results_v016.py
          python scripts/build_dedup_retrieval_view_v017.py
          python scripts/extend_concept_layer_v020.py
          python scripts/index_expanded_concepts_v021.py
          python scripts/normalise_semantic_representations_v022.py
      - name: Assert unified contract boundaries
        run: |
          python - <<'PY'
          import json,subprocess
          def q(term,*extra):
              return json.loads(subprocess.check_output(['python','scripts/query_unified_v024.py',term,*extra],text=True))

          golden=q('Golden Book of Wisdom','--state','accepted')
          psy=q('Psychedelics','--state','accepted')
          holds=q('Consciousness','--state','hold')
          reddit=q('Psychedelics','--domain','reddit','--state','accepted')

          for d in [golden,psy,holds,reddit]:
              assert d['contract']=='AKASHICNET_UNIFIED_RETRIEVAL'
              assert d['version']=='0.24'
              assert d['policy']['archive_mode']=='metadata_and_links_only'
              assert d['policy']['truth_inference_allowed'] is False
              assert d['policy']['rights_promotion_allowed'] is False
              assert d['policy']['scientific_evidence_promotion_allowed'] is False
              assert d['policy']['ranking_changes_semantic_decision'] is False
              ranks=[r['evidence_profile']['provenance_rank'] for r in d['results']]
              assert ranks==sorted(ranks,reverse=True)
              for r in d['results']:
                  g=r['contract_guards']
                  assert g['ranking_changes_semantic_decision'] is False
                  assert g['not_truth_claim'] is True
                  assert g['not_scientific_evidence_claim'] is True
                  assert g['not_rights_clearance_claim'] is True
                  assert g['not_safety_or_efficacy_claim'] is True

          assert golden['results']
          assert golden['results'][0]['semantic_decision']=='DIRECT_METADATA_LOOKUP'
          assert golden['results'][0]['evidence_profile']['provenance_tier']=='P3_SHA256_IDENTITY_PROVENANCE'
          assert golden['policy']['direct_metadata_lookup_is_not_semantic_acceptance'] is True

          assert psy['results']
          assert all(r['semantic_decision'] in {'ACCEPT','DIRECT_METADATA_LOOKUP'} for r in psy['results'])

          assert holds['results']
          assert all(r['semantic_decision']=='HOLD' for r in holds['results'])
          assert holds['policy']['hold_results_are_explicitly_addressable'] is True

          assert reddit['results']
          assert all(r['domain']=='reddit' for r in reddit['results'])
          assert all(r['semantic_decision']=='ACCEPT' for r in reddit['results'])

          print('AKASHICNET v0.24 PASS', {
              'golden_top_tier':golden['results'][0]['evidence_profile']['provenance_tier'],
              'psychedelics_accepted':len(psy['results']),
              'consciousness_holds':len(holds['results']),
              'reddit_psychedelics_accepted':len(reddit['results'])})
          PY
