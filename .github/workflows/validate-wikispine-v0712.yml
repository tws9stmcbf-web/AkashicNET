name: Validate WikiSpine consciousness researchers v0.7.12

on:
  pull_request:
    paths:
      - 'references/community/wikispine-batch-m-consciousness-researchers-v0.7.12.json'
      - 'references/community/wikispine-entity-aggregate-v0.7.12.json'
      - 'scripts/validate_wikispine_v0712.py'
      - '.github/workflows/validate-wikispine-v0712.yml'
  push:
    branches: [main]
    paths:
      - 'references/community/wikispine-batch-m-consciousness-researchers-v0.7.12.json'
      - 'references/community/wikispine-entity-aggregate-v0.7.12.json'
      - 'scripts/validate_wikispine_v0712.py'
      - '.github/workflows/validate-wikispine-v0712.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_wikispine_v0712.py
