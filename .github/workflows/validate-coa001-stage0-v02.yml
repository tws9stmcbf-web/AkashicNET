name: Validate COA-001 Stage-0 interview contract v0.2

on:
  pull_request:
    paths:
      - 'references/big-questions/BQ001/studies/COA-001/**'
      - 'scripts/validate_coa001_stage0_v02.py'
      - 'tests/test_coa001_stage0_v02.py'
      - '.github/workflows/validate-coa001-stage0-v02.yml'
  push:
    branches: [main]
    paths:
      - 'references/big-questions/BQ001/studies/COA-001/**'
      - 'scripts/validate_coa001_stage0_v02.py'
      - 'tests/test_coa001_stage0_v02.py'
      - '.github/workflows/validate-coa001-stage0-v02.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "Tested commit: $EXPECTED_HEAD" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Validate static Stage-0 boundaries
        run: python scripts/validate_coa001_stage0_v02.py
      - name: Run negative contract regressions
        run: python -m unittest discover -s tests -p 'test_coa001_stage0_v02.py' -v
