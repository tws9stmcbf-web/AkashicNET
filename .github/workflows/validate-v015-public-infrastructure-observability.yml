name: Validate v0.15 public infrastructure observability

on:
  pull_request:
    paths:
      - 'references/community/public-infrastructure-observability-v0.15.json'
      - 'references/community/public-status-v0.14.json'
      - 'scripts/validate_public_infrastructure_observability_v015.py'
      - '.github/workflows/validate-v015-public-infrastructure-observability.yml'
  push:
    branches: [main]
    paths:
      - 'references/community/public-infrastructure-observability-v0.15.json'
      - 'references/community/public-status-v0.14.json'
      - 'scripts/validate_public_infrastructure_observability_v015.py'
      - '.github/workflows/validate-v015-public-infrastructure-observability.yml'
  workflow_dispatch:
    inputs:
      live_probe:
        description: 'Run live HTTPS/redirects/indexing/manifest probe'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/validate_public_infrastructure_observability_v015.py

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live_probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/validate_public_infrastructure_observability_v015.py --live
