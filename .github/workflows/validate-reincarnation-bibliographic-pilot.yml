name: Validate reincarnation bibliographic pilot

on:
  pull_request:
    paths:
      - 'references/psi/reincarnation-bibliographic-pilot-2026-10-02.json'
      - 'tests/test_reincarnation_bibliographic_pilot.py'
      - '.github/workflows/validate-reincarnation-bibliographic-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'references/psi/reincarnation-bibliographic-pilot-2026-10-02.json'
      - 'tests/test_reincarnation_bibliographic_pilot.py'
      - '.github/workflows/validate-reincarnation-bibliographic-pilot.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_reincarnation_bibliographic_pilot.py' -v
