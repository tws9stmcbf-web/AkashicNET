name: Validate Public Beta status

on:
  pull_request:
    paths:
      - README.md
      - tools/validate_public_beta_status.py
      - .github/workflows/validate-public-beta-status.yml
  push:
    branches: [main]
    paths:
      - README.md
      - tools/validate_public_beta_status.py
      - .github/workflows/validate-public-beta-status.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_public_beta_status.py
