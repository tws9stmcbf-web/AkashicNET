name: Validate Public Beta status

on:
  pull_request:
    paths:
      - README.md
      - 'references/community/wikispine-entity-aggregate-v*.json'
      - tools/validate_public_beta_status.py
      - tests/test_public_beta_status.py
      - .github/workflows/validate-public-beta-status.yml
  push:
    branches: [main]
    paths:
      - README.md
      - 'references/community/wikispine-entity-aggregate-v*.json'
      - tools/validate_public_beta_status.py
      - tests/test_public_beta_status.py
      - .github/workflows/validate-public-beta-status.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate current Public Beta status
        run: python tools/validate_public_beta_status.py
      - name: Run status regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_public_beta_status.py
