name: Validate v0.14 release ledger

on:
  pull_request:
    paths:
      - 'references/community/release-ledger-v0.14.json'
      - 'references/community/public-knowledge-beta-release-manifest-v0.13.json'
      - 'scripts/validate_release_ledger_v014.py'
      - '.github/workflows/validate-release-ledger-v014.yml'
  push:
    branches: [main]
    paths:
      - 'references/community/release-ledger-v0.14.json'
      - 'references/community/public-knowledge-beta-release-manifest-v0.13.json'
      - 'scripts/validate_release_ledger_v014.py'
      - '.github/workflows/validate-release-ledger-v014.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Validate release ledger
        run: python scripts/validate_release_ledger_v014.py
      - name: Re-run immutable Actions gate
        run: python scripts/validate_actions_immutable_refs.py
