name: Validate global topic contract

on:
  pull_request:
    paths:
      - 'data/global_metadata_discovery_v01.seed.json'
      - 'schemas/global_topic_v01.schema.json'
      - 'scripts/validate_global_topic_contract.py'
      - 'tests/test_global_topic*'
      - 'tests/global-topic-requirements.txt'
      - 'website/**'
      - 'docs/global-topic-pages-v0.1.md'
      - '.github/workflows/validate-global-topic-contract.yml'
  push:
    branches: [main]
    paths:
      - 'data/global_metadata_discovery_v01.seed.json'
      - 'schemas/global_topic_v01.schema.json'
      - 'scripts/validate_global_topic_contract.py'
      - 'tests/test_global_topic*'
      - 'tests/global-topic-requirements.txt'
      - 'website/**'
      - 'docs/global-topic-pages-v0.1.md'
      - '.github/workflows/validate-global-topic-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/global-topic-requirements.txt
      - run: python scripts/validate_global_topic_contract.py
      - run: python -m unittest discover -s tests -p test_global_topic_contract.py -v
      - run: node --test tests/test_global_topic_routes.mjs
      - run: python scripts/validate_public_route_qa_v013.py
