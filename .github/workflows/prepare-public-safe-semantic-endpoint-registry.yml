name: Prepare public-safe semantic endpoint registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_public_safe_semantic_endpoint_registry_v019.py"
      - "scripts/topic_census_v075.py"
      - "references/community/wikispine-*.json"
      - "references/community/concept-seed-v0.20.csv"
      - "references/community/n2n-pilot-index.csv"
      - "references/community/n2n-test-batch-25.csv"
      - "references/community/knowledge-graph-seed-v0.1.md"
      - "references/big-questions/architecture-v0.1.json"
      - "references/big-questions/**/public-synthesis-v0.1.json"
      - "references/big-questions/**/evidence-batch*-v0.1.json"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: public-safe-semantic-endpoint-registry
  cancel-in-progress: false

jobs:
  prepare-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build and validate registry
        run: |
          python scripts/build_public_safe_semantic_endpoint_registry_v019.py
          python -m unittest -v tests/test_public_safe_semantic_endpoint_registry_v019.py
          python -m py_compile scripts/build_public_safe_semantic_endpoint_registry_v019.py tests/test_public_safe_semantic_endpoint_registry_v019.py
      - name: Open governed registry pull request when changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OUTPUT: references/community/public-safe-semantic-endpoint-registry-v0.1.9.json
        run: |
          if [ -z "$(git status --porcelain -- "$OUTPUT")" ]; then
            echo "Semantic endpoint registry is current; no pull request required."
            exit 0
          fi
          packet_digest="$(sha256sum "$OUTPUT" | cut -d' ' -f1)"
          branch="automation/public-safe-endpoints-${packet_digest:0:12}"
          existing="$(gh pr list --repo "$REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Registry already has pull request #$existing."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$OUTPUT"
          git commit -m "Prepare public-safe semantic endpoint registry"
          git push origin "$branch"
          gh label create human-reviewed --repo "$REPOSITORY" --color 0E8A16 --description "Human reviewed the governed packet; permits exact-head mechanical merge only" --force
          pr_url="$(gh pr create --repo "$REPOSITORY" --base main --head "$branch" --draft \
            --title "Prepare public-safe semantic endpoint registry" \
            --body $'Generated deterministically from reviewed public repository metadata. The registry contains typed endpoints and zero edges. No endpoint registration promotes truth, evidence, rights, or canonical identity.\n\nAfter reviewing the endpoint records, add the `human-reviewed` label. The owner-only merge gate will validate this exact head and squash-merge mechanically.')"
          echo "Opened $pr_url"
          gh workflow run validate-public-safe-semantic-endpoint-registry.yml --repo "$REPOSITORY" --ref "$branch"
