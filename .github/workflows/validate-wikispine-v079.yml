name: Validate WikiSpine canonical works v0.7.9

on:
  pull_request:
    paths:
      - 'references/community/wikispine-batch-j-canonical-works-v0.7.9.json'
      - 'references/community/wikispine-entity-aggregate-v0.7.9.json'
      - 'scripts/validate_wikispine_v079.py'
      - '.github/workflows/validate-wikispine-v079.yml'
  push:
    branches: [main]
    paths:
      - 'references/community/wikispine-batch-j-canonical-works-v0.7.9.json'
      - 'references/community/wikispine-entity-aggregate-v0.7.9.json'
      - 'scripts/validate_wikispine_v079.py'
      - '.github/workflows/validate-wikispine-v079.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_wikispine_v079.py
