name: Validate bounded-question evidence bundle v0.1

on:
  pull_request:
    paths:
      - 'data/bounded_question_evidence_bundle_v01.schema.json'
      - 'data/evidence_claim_v01.schema.json'
      - 'references/community/evidence-taxonomy-v0.10.json'
      - 'references/community/bq*-*.json'
      - 'scripts/validate_bounded_question_evidence_bundle_v01.py'
      - 'tests/test_bounded_question_evidence_bundle_v01.py'
      - '.github/workflows/validate-bounded-question-evidence-bundle-v01.yml'
  push:
    branches: [main]
    paths:
      - 'data/bounded_question_evidence_bundle_v01.schema.json'
      - 'data/evidence_claim_v01.schema.json'
      - 'references/community/evidence-taxonomy-v0.10.json'
      - 'references/community/bq*-*.json'
      - 'scripts/validate_bounded_question_evidence_bundle_v01.py'
      - 'tests/test_bounded_question_evidence_bundle_v01.py'
      - '.github/workflows/validate-bounded-question-evidence-bundle-v01.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate current BQ001 bundle
        run: python scripts/validate_bounded_question_evidence_bundle_v01.py references/community/bq001-scientific-baseline-batch1.json
      - name: Run negative tests
        run: python -m pytest -q tests/test_bounded_question_evidence_bundle_v01.py
