name: Validate canonical dedup integration v0.6.9

on:
  pull_request:
    paths:
      - 'references/community/drive-p1-cumulative-hash-checkpoint-v0.6.8.json'
      - 'references/community/dedup-integration-checkpoint-v0.6.9.json'
      - 'scripts/validate_dedup_integration_v069.py'
      - '.github/workflows/validate-dedup-integration-v069.yml'
  push:
    branches: [ main ]
    paths:
      - 'references/community/drive-p1-cumulative-hash-checkpoint-v0.6.8.json'
      - 'references/community/dedup-integration-checkpoint-v0.6.9.json'
      - 'scripts/validate_dedup_integration_v069.py'
      - '.github/workflows/validate-dedup-integration-v069.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_dedup_integration_v069.py
