name: Validate v0.15 release candidate

on:
  pull_request:
    paths:
      - 'references/community/public-sync-observability-beta-release-manifest-v0.15.json'
      - 'scripts/validate_v015_release_candidate.py'
      - 'scripts/validate_v015_readiness.py'
      - '.github/workflows/validate-v015-release-candidate.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/validate_v015_release_candidate.py
