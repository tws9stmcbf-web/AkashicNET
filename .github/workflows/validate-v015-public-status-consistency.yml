name: Validate v0.15 public status consistency

on:
  pull_request:
    paths:
      - 'references/community/public-status-consistency-v0.15.json'
      - 'references/community/public-status-v0.14.json'
      - 'references/community/release-ledger-v0.14.json'
      - 'docs/V014_PUBLIC_SYNC.md'
      - 'CHANGELOG.md'
      - 'website/app/page.tsx'
      - 'scripts/validate_public_status_consistency_v015.py'
      - '.github/workflows/validate-v015-public-status-consistency.yml'
  push:
    branches: [main]
    paths:
      - 'references/community/public-status-consistency-v0.15.json'
      - 'references/community/public-status-v0.14.json'
      - 'references/community/release-ledger-v0.14.json'
      - 'docs/V014_PUBLIC_SYNC.md'
      - 'CHANGELOG.md'
      - 'website/app/page.tsx'
      - 'scripts/validate_public_status_consistency_v015.py'
      - '.github/workflows/validate-v015-public-status-consistency.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/validate_public_status_consistency_v015.py
