name: Validate BQ011 authoring

on:
  pull_request:
    paths:
      - "references/big-questions/BQ011/**"
      - "references/big-questions/architecture-v0.1.json"
      - "references/big-questions/gold-nuggets-cross-question-synthesis-v0.1.json"
      - "scripts/validate_bq011_authoring_v01.py"
      - "tests/test_bq011_authoring_v01.py"
      - ".github/workflows/validate-bq011-authoring.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python scripts/validate_bq011_authoring_v01.py
      - run: python -m unittest tests/test_bq011_authoring_v01.py
      - run: python scripts/validate_big_questions_registry_v013.py
