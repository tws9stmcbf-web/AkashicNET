name: Validate P1 large wave20 hash evidence v0.6.8

on:
  pull_request:
    paths:
      - 'references/community/drive-p1-large-wave20-hash-summary-v0.6.8.json'
      - 'scripts/validate_p1_large_wave20_v068.py'
      - '.github/workflows/validate-p1-large-wave20-v068.yml'
  push:
    branches: [ main ]
    paths:
      - 'references/community/drive-p1-large-wave20-hash-summary-v0.6.8.json'
      - 'scripts/validate_p1_large_wave20_v068.py'
      - '.github/workflows/validate-p1-large-wave20-v068.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_p1_large_wave20_v068.py
