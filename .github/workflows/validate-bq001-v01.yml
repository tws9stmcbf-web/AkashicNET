name: Validate BQ001 Public Beta Gate v0.1

on:
  pull_request:
    paths:
      - "references/big-questions/BQ001/**"
      - "scripts/validate_bq001_v01.py"
      - "scripts/validate_bq001_batch1_v01.py"
      - "scripts/validate_bq001_batch2_v01.py"
      - "scripts/validate_bq001_batch3_v01.py"
      - "scripts/validate_bq001_batch4_v01.py"
      - "tests/test_bq001_v01.py"
      - "tests/test_bq001_batch1_v01.py"
      - "tests/test_bq001_batch2_v01.py"
      - "tests/test_bq001_batch3_v01.py"
      - "tests/test_bq001_batch4_v01.py"
      - ".github/workflows/validate-bq001-v01.yml"
  push:
    branches: [main]
    paths:
      - "references/big-questions/BQ001/**"
      - "scripts/validate_bq001_v01.py"
      - "scripts/validate_bq001_batch1_v01.py"
      - "scripts/validate_bq001_batch2_v01.py"
      - "scripts/validate_bq001_batch3_v01.py"
      - "scripts/validate_bq001_batch4_v01.py"
      - "tests/test_bq001_v01.py"
      - "tests/test_bq001_batch1_v01.py"
      - "tests/test_bq001_batch2_v01.py"
      - "tests/test_bq001_batch3_v01.py"
      - "tests/test_bq001_batch4_v01.py"
      - ".github/workflows/validate-bq001-v01.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Validate BQ001 seed contract
        run: python scripts/validate_bq001_v01.py references/big-questions/BQ001/spec-v0.1.json
      - name: Run BQ001 seed fail-closed tests
        run: python tests/test_bq001_v01.py
      - name: Validate BQ001 scientific baseline batch
        run: python scripts/validate_bq001_batch1_v01.py references/big-questions/BQ001/evidence-batch1-v0.1.json
      - name: Run BQ001 scientific baseline negative tests
        run: python tests/test_bq001_batch1_v01.py
      - name: Validate BQ001 memory identity and NDE methods batch
        run: python scripts/validate_bq001_batch2_v01.py references/big-questions/BQ001/evidence-batch2-v0.1.json
      - name: Run BQ001 Batch 2 negative tests
        run: python tests/test_bq001_batch2_v01.py
      - name: Validate BQ001 reincarnation methods batch
        run: python scripts/validate_bq001_batch3_v01.py references/big-questions/BQ001/evidence-batch3-v0.1.json
      - name: Run BQ001 Batch 3 negative tests
        run: python tests/test_bq001_batch3_v01.py
      - name: Validate BQ001 contemplative and philosophy batch
        run: python scripts/validate_bq001_batch4_v01.py references/big-questions/BQ001/evidence-batch4-v0.1.json
      - name: Run BQ001 Batch 4 negative tests
        run: python tests/test_bq001_batch4_v01.py
