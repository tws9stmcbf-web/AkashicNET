name: Validate immutable GitHub Actions refs

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/validate_actions_immutable_refs.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/validate_actions_immutable_refs.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_actions_immutable_refs.py
