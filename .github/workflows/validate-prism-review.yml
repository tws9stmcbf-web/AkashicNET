name: Validate PRISM review surfaces

on:
  pull_request:
    paths:
      - 'schemas/akashic-prism*.schema.json'
      - 'website/**'
      - 'scripts/validate_prism*.py'
      - 'tests/test_prism*.py'
      - 'tests/fixtures/prism/**'
      - 'tests/prism-website/**'
      - 'references/knowledge-governance/**'
      - '.github/workflows/validate-prism*.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/akashic-prism*.schema.json'
      - 'website/**'
      - 'scripts/validate_prism*.py'
      - 'tests/test_prism*.py'
      - 'tests/fixtures/prism/**'
      - 'tests/prism-website/**'
      - 'references/knowledge-governance/**'
      - '.github/workflows/validate-prism*.yml'

permissions:
  contents: read

jobs:
  schema-and-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.26.0
      - run: python scripts/validate_prism_blocked_crosswalk.py
      - run: python scripts/validate_prism_connections.py tests/fixtures/prism/connection-traceability.json
      - run: python scripts/validate_prism_connections.py tests/fixtures/prism/cultural-privacy-hold.json
      - run: python -m unittest discover -s tests -p 'test_prism*.py' -v
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --prefix tests/prism-website --ignore-scripts --no-audit --no-fund
      - run: ./tests/prism-website/node_modules/.bin/playwright install --with-deps chromium
      - run: npm run check --prefix tests/prism-website
