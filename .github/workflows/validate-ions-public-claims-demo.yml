name: Validate IONS public-claims review demo

on:
  pull_request:
    paths:
      - 'data/akashicomni/ions-public-claims-demo-v0.5.0.json'
      - 'references/akashicomni/IONS-Public-Claims-Extraction-2026-10-12.md'
      - 'docs/IONS_PUBLIC_CLAIMS_DEMO.md'
      - 'tests/test_ions_public_claims_demo.py'
      - 'schemas/akashicomni-claim-review-v0.5.0.schema.json'
      - 'scripts/validate_akashicomni_claim_review_v050.py'
      - 'references/akashicomni/trusted-verifications-v0.5.0.json'
      - '.github/workflows/validate-ions-public-claims-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-only-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install jsonschema==4.26.0
      - run: python scripts/validate_akashicomni_claim_review_v050.py data/akashicomni/ions-public-claims-demo-v0.5.0.json
      - run: python -m unittest discover -s tests -p 'test_ions_public_claims_demo.py' -v
