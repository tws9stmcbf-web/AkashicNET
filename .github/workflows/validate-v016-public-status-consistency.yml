name: Validate v0.16 public status consistency

on:
  pull_request:
    paths:
      - 'website/app/page.tsx'
      - 'website/app/development-progress/page.tsx'
      - 'website/app/**/*.tsx'
      - 'scripts/validate_public_status_consistency_v016.py'
      - '.github/workflows/validate-v016-public-status-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-status-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Preserve sealed v0.15 contract
        run: python scripts/validate_public_status_consistency_v015.py
      - name: Validate current v0.16 status surfaces
        run: python scripts/validate_public_status_consistency_v016.py
