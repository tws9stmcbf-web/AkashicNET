name: Validate v0.16 Knowledge Graph Beta readiness

on:
  pull_request:
    paths:
      - 'references/big-questions/BQ001/knowledge-graph-beta-fixture-v0.16.json'
      - 'schemas/knowledge-graph-beta-v0.16.schema.json'
      - 'scripts/build_knowledge_graph_beta_fixture_v016.py'
      - 'scripts/validate_knowledge_graph_beta_v016.py'
      - 'scripts/validate_v016_readiness.py'
      - 'tests/test_knowledge_graph_beta_v016.py'
      - '.github/workflows/validate-v016-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/validate_v016_readiness.py
