name: Validate WikiSpine people v0.7.7

on:
  pull_request:
    paths:
      - 'references/community/wikispine-batch-g1-people-v0.7.7.json'
      - 'scripts/validate_wikispine_people_v077.py'
      - '.github/workflows/validate-wikispine-people-v077.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate five-person WikiSpine batch
        run: python scripts/validate_wikispine_people_v077.py
