name: Validate promoted topic census v0.7.7

on:
  pull_request:
    paths:
      - "scripts/topic_census_v077.py"
      - "tests/test_topic_census_v077.py"
      - "references/community/topic-census-promoted-v0.7.7.json"
      - "references/community/topic-census-promoted-method-v0.7.7.md"
      - "references/community/wikipedia-akashic-pilot.csv"
      - ".github/workflows/validate-topic-census-v077.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run promoted topic census
        run: python scripts/topic_census_v077.py
      - name: Validate promoted census contract
        run: python tests/test_topic_census_v077.py
