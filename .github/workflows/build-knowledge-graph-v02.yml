name: Build knowledge graph v0.2

on:
  push:
    branches:
      - akashicnet-validation-descendants
    paths:
      - 'scripts/build_knowledge_graph_v02.py'
      - 'references/community/drive-metadata-root-census.csv'
      - 'references/community/drive-metadata-descendant-census.csv'
      - 'references/community/drive-metadata-final-reconciliation.csv'
      - 'references/community/drive-validation-descendant-batch-0011.csv'
      - '.github/workflows/build-knowledge-graph-v02.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate graph
        run: |
          python scripts/build_knowledge_graph_v02.py \
            --input references/community/drive-metadata-root-census.csv \
            --input references/community/drive-metadata-descendant-census.csv \
            --input references/community/drive-metadata-final-reconciliation.csv \
            --input references/community/drive-validation-descendant-batch-0011.csv \
            --output data/knowledge-graph-v0.2.json \
            --expected-drive-nodes 195
      - name: Verify release integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/knowledge-graph-v0.2.json')
          g = json.loads(p.read_text(encoding='utf-8'))
          i = g['integrity']
          assert i['expected_count_match'] is True, i
          assert i.get('release_integrity_pass', False) is True, i
          assert i['unique_drive_nodes'] == 195, i
          print('release_integrity_pass=true')
          print('unique_drive_nodes=195')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-graph-v0.2
          path: data/knowledge-graph-v0.2.json
          if-no-files-found: error
