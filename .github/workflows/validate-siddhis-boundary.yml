name: Validate Siddhis question-only boundary

on:
  pull_request:
    paths:
      - 'website/**'
      - 'references/**'
      - 'scripts/validate_siddhis_boundary.py'
      - 'tests/test_siddhis_boundary.py'
      - '.github/workflows/validate-siddhis-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'references/**'
      - 'scripts/validate_siddhis_boundary.py'
      - 'tests/test_siddhis_boundary.py'
      - '.github/workflows/validate-siddhis-boundary.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_siddhis_boundary.py
      - run: python -m unittest discover -s tests -p test_siddhis_boundary.py -v
