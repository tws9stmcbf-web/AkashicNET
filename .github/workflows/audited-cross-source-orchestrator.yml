name: Prepare audited cross-source review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "references/community/n2n-test-batch-25.csv"
      - "references/community/knowledge-graph-seed-v0.1.md"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: audited-cross-source-orchestrator
  cancel-in-progress: false

jobs:
  prepare-review-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build and validate deterministic packet
        run: |
          python scripts/prepare_audited_cross_source_review.py
          python -m unittest -v tests/test_prepare_audited_cross_source_review.py
          python -m py_compile scripts/prepare_audited_cross_source_review.py tests/test_prepare_audited_cross_source_review.py
      - name: Open draft review pull request when inputs changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OUTPUT: references/community/cross-source-orchestrator-review-v0.1.8.json
        run: |
          if git diff --quiet -- "$OUTPUT"; then
            echo "Review packet is already current; no pull request required."
            exit 0
          fi

          packet_digest="$(sha256sum "$OUTPUT" | cut -d' ' -f1)"
          branch="automation/audited-cross-source-${packet_digest:0:12}"
          existing="$(gh pr list --repo "$REPOSITORY" --head "$branch" --state all --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Packet already has pull request #$existing."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$OUTPUT"
          git commit -m "Prepare audited cross-source review packet"
          git push origin "$branch"

          gh label create human-reviewed --repo "$REPOSITORY" --color 0E8A16 \
            --description "Human reviewed the proposal packet; permits exact-head mechanical merge only" --force
          pr_url="$(gh pr create --repo "$REPOSITORY" --base main --head "$branch" --draft \
            --title "Prepare automated audited cross-source review packet" \
            --body $'Generated deterministically from validated public-safe indexes.\n\nThis pull request contains review candidates only. Every candidate remains `INFERRED_CANDIDATE`, `REVIEW_REQUIRED`, and `accepted_edge=false`; no graph edges are created.\n\nAfter reviewing the exact-anchor proposals, add the `human-reviewed` label. The merge gate will validate this exact head and squash-merge the packet mechanically.')"
          echo "Opened $pr_url"
          gh workflow run validate-audited-cross-source-orchestrator.yml --repo "$REPOSITORY" --ref "$branch"
