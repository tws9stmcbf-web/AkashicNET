name: Validate WikiSpine cognition researchers v0.7.13

on:
  pull_request:
    paths:
      - 'references/community/wikispine-batch-n-cognition-researchers-v0.7.13.json'
      - 'references/community/wikispine-entity-aggregate-v0.7.13.json'
      - 'scripts/validate_wikispine_v0713.py'
      - '.github/workflows/validate-wikispine-v0713.yml'
  push:
    branches: [ main ]
    paths:
      - 'references/community/wikispine-batch-n-cognition-researchers-v0.7.13.json'
      - 'references/community/wikispine-entity-aggregate-v0.7.13.json'
      - 'scripts/validate_wikispine_v0713.py'
      - '.github/workflows/validate-wikispine-v0713.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_wikispine_v0713.py
