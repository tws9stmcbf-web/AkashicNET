name: Validate v0.16 composite release candidate

on:
  pull_request:
    paths:
      - 'manifests/v0.16-release-candidate.json'
      - 'references/big-questions/BQ001/knowledge-graph-beta-fixture-v0.16.json'
      - 'references/big-questions/BQ001/spec-v0.1.json'
      - 'references/big-questions/BQ001/evidence-batch2-v0.1.json'
      - 'references/big-questions/BQ001/evidence-batch4-v0.1.json'
      - 'references/source-integrity-v014-assessment-batch3d-review-v0.1.json'
      - 'research/microdosing-research-2026.md'
      - 'references/source-status-fixture-v0.16*.json'
      - 'references/fixtures/source-status-synthetic-scenarios-v0.16.md'
      - 'schemas/knowledge-graph-beta-v0.16.schema.json'
      - 'schemas/source-status-v0.16.schema.json'
      - 'scripts/build_knowledge_graph_beta_fixture_v016.py'
      - 'scripts/validate_knowledge_graph_beta_v016.py'
      - 'scripts/validate_source_status_v016.py'
      - 'scripts/validate_v016_readiness.py'
      - 'scripts/validate_v016_release_candidate.py'
      - 'tests/test_knowledge_graph_beta_v016.py'
      - 'tests/test_source_status_v016.py'
      - 'tests/test_v016_release_candidate.py'
      - '.github/workflows/validate-knowledge-graph-beta-v016.yml'
      - '.github/workflows/validate-source-status-v016.yml'
      - '.github/workflows/validate-v016-readiness.yml'
      - '.github/workflows/validate-v016-release-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate composite candidate
        env:
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/validate_v016_release_candidate.py
