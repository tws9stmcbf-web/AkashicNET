name: Test retrieval consumer contract v0.26

on:
  push:
    branches: [akashicnet-validation-descendants]
  pull_request:
    branches: [main]

jobs:
  retrieval-consumer-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build prerequisite layers
        run: |
          python scripts/build_knowledge_graph_v02.py
          python scripts/build_knowledge_graph_v03.py
          python scripts/overlay_canonical_reconciliation_v04.py
          python scripts/overlay_evidence_provenance_v05.py
          python scripts/build_cross_source_graph_v07.py
          python scripts/build_concept_layer_v010.py
          python scripts/adjudicate_concept_edges_v011.py
          python scripts/complete_collection_provenance_v013.py
          python scripts/overlay_manifestation_provenance_v014.py
          python scripts/overlay_hash_evidence_v015.py
          python scripts/apply_hash_results_v016.py
          python scripts/build_dedup_retrieval_view_v017.py
          python scripts/extend_concept_layer_v020.py
          python scripts/index_expanded_concepts_v021.py
          python scripts/normalise_semantic_representations_v022.py
      - name: Assert documented consumer behaviour
        run: |
          python - <<'PY'
          import json, subprocess, pathlib

          docs=pathlib.Path('docs/retrieval-api-v0.25.md').read_text()
          policy=pathlib.Path('references/community/retrieval-api-compatibility-policy-v0.26.md').read_text()
          assert 'AKASHICNET_RETRIEVAL_API' in docs
          assert 'akashicnet://schemas/retrieval/v0.25' in docs
          assert 'DIRECT_METADATA_LOOKUP is not semantic acceptance' in policy
          assert 'truth inference: OFF' in policy

          def api(term,*extra):
              return json.loads(subprocess.check_output(['python','scripts/query_api_v025.py',term,*extra],text=True))
          def client(term,*extra):
              return json.loads(subprocess.check_output(['python','examples/retrieval_client_v026.py',term,*extra],text=True))

          golden=api('Golden Book of Wisdom','--state','accepted')
          holds=api('Consciousness','--state','hold','--limit','5')
          reddit=api('Psychedelics','--domain','reddit','--state','accepted','--limit','5')
          client_golden=client('Golden Book of Wisdom','--state','accepted')

          for d in (golden,holds,reddit):
              assert d['api']=='AKASHICNET_RETRIEVAL_API'
              assert d['api_version']=='0.25'
              assert d['schema_id']=='akashicnet://schemas/retrieval/v0.25'
              assert d['policy']['truth_inference_allowed'] is False
              assert d['policy']['rights_promotion_allowed'] is False
              assert d['policy']['scientific_evidence_promotion_allowed'] is False
              assert d['policy']['ranking_changes_semantic_decision'] is False
              for r in d['results']:
                  assert r['contract_guards']['not_truth_claim'] is True
                  assert r['contract_guards']['not_rights_clearance_claim'] is True
                  assert r['contract_guards']['not_scientific_evidence_claim'] is True

          assert golden['results'][0]['semantic_decision']=='DIRECT_METADATA_LOOKUP'
          assert golden['results'][0]['evidence_profile']['provenance_tier']=='P3_SHA256_IDENTITY_PROVENANCE'
          assert holds['results'] and all(r['semantic_decision']=='HOLD' for r in holds['results'])
          assert reddit['results'] and all(r['domain']=='reddit' and r['semantic_decision']=='ACCEPT' for r in reddit['results'])

          assert client_golden['api_version']=='0.25'
          assert client_golden['schema_id']=='akashicnet://schemas/retrieval/v0.25'
          assert client_golden['results_returned']==1
          assert client_golden['results'][0]['provenance_tier']=='P3_SHA256_IDENTITY_PROVENANCE'

          print('AKASHICNET v0.26 PASS', {
              'documented_api':'0.25',
              'consumer_schema':'akashicnet://schemas/retrieval/v0.25',
              'golden_results':client_golden['results_returned'],
              'hold_sample':len(holds['results']),
              'reddit_sample':len(reddit['results']),
              'truth_inference':False,
              'rights_promotion':False,
              'scientific_evidence_promotion':False,
          })
          PY
