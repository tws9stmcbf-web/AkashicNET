name: Test cross-source candidates v0.8

on:
  push:
    branches: [akashicnet-validation-descendants]
    paths:
      - 'scripts/cross_source_candidates_v08.py'
      - '.github/workflows/test-cross-source-candidates-v08.yml'
      - 'references/community/n2n-pilot-index.csv'
      - 'scripts/build_knowledge_graph_v02.py'
      - 'scripts/build_knowledge_graph_v03.py'
      - 'scripts/overlay_canonical_reconciliation_v04.py'
      - 'scripts/overlay_evidence_provenance_v05.py'
      - 'scripts/build_cross_source_graph_v07.py'

jobs:
  candidate-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build graph through v0.7
        run: |
          python scripts/build_knowledge_graph_v02.py
          python scripts/build_knowledge_graph_v03.py
          python scripts/overlay_canonical_reconciliation_v04.py
          python scripts/overlay_evidence_provenance_v05.py
          python scripts/build_cross_source_graph_v07.py
      - name: Generate review candidates
        run: python scripts/cross_source_candidates_v08.py
      - name: Assert candidate safety boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/cross-source-candidates-v0.8.json',encoding='utf-8'))
          assert d['reddit_records_examined']==1000
          assert d['canonical_families_examined']>=29
          assert d['accepted_edge_count']==0
          assert d['review_required_count']==d['candidate_count']
          assert d['truth_inference_allowed'] is False
          assert d['rights_promotion_allowed'] is False
          assert d['scientific_evidence_promotion_allowed'] is False
          assert all(c['review_state']=='REVIEW_REQUIRED' for c in d['candidates'])
          assert all(c['accepted_edge'] is False for c in d['candidates'])
          print(f"AKASHICNET v0.8 PASS: {d['candidate_count']} review candidates; 0 accepted edges")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cross-source-candidates-v0.8
          path: data/cross-source-candidates-v0.8.json
          if-no-files-found: error
