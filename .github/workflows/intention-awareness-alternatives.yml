name: Intention Awareness provisional primary alternatives

on:
  pull_request:
    paths:
      - 'research/intention-awareness/design-assessment-2026-10-26/primary-alternatives/**'
      - 'research/intention-awareness/design-assessment-2026-10-26/assessment.py'
      - 'research/intention-awareness/design-assessment-2026-10-26/requirements.txt'
      - '.github/workflows/intention-awareness-alternatives.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alternatives-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.12'
      - name: Install pinned assessment dependencies
        run: python -m pip install -r research/intention-awareness/design-assessment-2026-10-26/requirements.txt
      - name: Analytic and exhaustive-resampling checks
        working-directory: research/intention-awareness/design-assessment-2026-10-26/primary-alternatives
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Verify retained follow-up and inherited bytes
        working-directory: research/intention-awareness/design-assessment-2026-10-26/primary-alternatives
        run: python verify.py
      - name: Software smoke run only
        working-directory: research/intention-awareness/design-assessment-2026-10-26/primary-alternatives
        run: python alternatives.py --out smoke --reps 10 --bootstrap-reps 5 --draws 19
