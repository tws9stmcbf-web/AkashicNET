name: Validate v0.14 source coverage

on:
  pull_request:
    paths:
      - 'references/**'
      - 'data/**'
      - 'docs/**'
      - 'modules/**'
      - 'README.md'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'scripts/validate_source_coverage_v014.py'
      - '.github/workflows/validate-source-coverage-v014.yml'
  push:
    branches: [main]
    paths:
      - 'references/**'
      - 'data/**'
      - 'docs/**'
      - 'modules/**'
      - 'README.md'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'scripts/validate_source_coverage_v014.py'
      - '.github/workflows/validate-source-coverage-v014.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Generate and validate complete source denominator
        run: python scripts/validate_source_coverage_v014.py
      - name: Require generated machine-readable inventory
        run: test -s artifacts/source-coverage-v0.14.generated.json
      - name: Re-run immutable Actions gate
        run: python scripts/validate_actions_immutable_refs.py
