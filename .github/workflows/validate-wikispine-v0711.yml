name: Validate WikiSpine v0.7.11

on:
  pull_request:
    paths:
      - 'references/community/wikispine-batch-l-foundations-v0.7.11.json'
      - 'references/community/wikispine-entity-aggregate-v0.7.11.json'
      - 'references/community/wikispine-entity-aggregate-v0.7.10.json'
      - 'scripts/validate_wikispine_v0711.py'
      - '.github/workflows/validate-wikispine-v0711.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate WikiSpine v0.7.11
        run: python scripts/validate_wikispine_v0711.py
