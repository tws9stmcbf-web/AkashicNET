- id: N02
  type: decision
  title: Separate psychology, hidden targets, source identity and physical models
  provenance: ai-suggested
  timestamp: 2026-10-18T07:23+00:00
  choice: Propose a present-hidden-target pilot with trained/minimal knowledge and
    metta/reflection conditions; retain explicit bridge approval and independent review
    requirements.
